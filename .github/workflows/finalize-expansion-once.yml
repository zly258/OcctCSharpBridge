name: Finalize Expanded Bridge Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-expansion-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Normalize final repository state
        shell: pwsh
        run: |
          $utf8Bom = [System.Text.UTF8Encoding]::new($true)

          foreach ($path in @('README.md', 'README.zh-CN.md')) {
              $text = [System.IO.File]::ReadAllText($path)
              $text = [regex]::Replace($text, '(Native exports[：:]\s*`)\d+(`)', '${1}344${2}')
              $text = [regex]::Replace($text, '(Managed P/Invoke(?: declarations)?[：:]\s*`)\d+(`)', '${1}344${2}')
              $text = [regex]::Replace($text, '(Public \.NET types[：:]\s*`)\d+(`)', '${1}86${2}')
              $text = [regex]::Replace($text, '(Modeling API[：:]\s*`)\d+(`)', '${1}132${2}')
              $text = $text -replace '\b(?:81|82|83|84|85) 个公开 \.NET 类型\b', '86 个公开 .NET 类型'
              $text = $text -replace '\b(?:81|82|83|84|85) public \.NET types\b', '86 public .NET types'
              [System.IO.File]::WriteAllText($path, $text, $utf8Bom)
          }

          $runtimePath = 'src/OcctNet/OcctRuntime.cs'
          $runtime = [System.IO.File]::ReadAllText($runtimePath)
          if (-not $runtime.Contains('public static partial class OcctRuntime')) {
              if (-not $runtime.Contains('public static class OcctRuntime')) {
                  throw 'OcctRuntime declaration was not found.'
              }
              $runtime = $runtime.Replace('public static class OcctRuntime', 'public static partial class OcctRuntime')
              [System.IO.File]::WriteAllText($runtimePath, $runtime, $utf8Bom)
          }

          $buildPath = 'build.ps1'
          $build = [System.IO.File]::ReadAllText($buildPath)
          $geometry = '    Geometry = "tests\check-geometry-api.ps1"'
          $topology = '    TopologyAnalysis = "tests\check-topology-analysis.ps1"'
          $runtimeCheck = '    RuntimeDiagnostics = "tests\check-runtime-diagnostics.ps1"'
          if (-not $build.Contains($topology)) {
              if (-not $build.Contains($geometry)) { throw 'Geometry check anchor was not found.' }
              $build = $build.Replace($geometry, "$geometry`r`n$topology")
          }
          if (-not $build.Contains($runtimeCheck)) {
              $build = $build.Replace($topology, "$topology`r`n$runtimeCheck")
          }
          [System.IO.File]::WriteAllText($buildPath, $build, $utf8Bom)

          foreach ($temp in @(
              '.github/workflows/make-runtime-partial-once.yml',
              '.github/workflows/add-topology-check-once.yml',
              '.github/workflows/add-runtime-check-once.yml',
              '.github/workflows/sync-readme-api-stats-once.yml',
              '.github/workflows/sync-api-docs-once.yml',
              '.github/workflows/finalize-expansion-once.yml'
          )) {
              if (Test-Path $temp) { Remove-Item $temp -Force }
          }

      - name: Commit final state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "Finalize expanded bridge contracts"
            git push origin HEAD:main
          fi
