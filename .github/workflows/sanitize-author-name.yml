name: Normalize author name

on:
  push:
    branches: [website]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website
          fetch-depth: 0
      - name: Keep English author name only
        shell: python
        run: |
          from pathlib import Path
          replacements = [
              ("Zhang Liaoyuan (zhangly1403)", "Zhang Liaoyuan"),
              ("Zhang Liaoyuan · zhangly1403", "Zhang Liaoyuan"),
              ("张燎原 / Zhang Liaoyuan", "Zhang Liaoyuan"),
              ("张燎原（zhangly1403）", "Zhang Liaoyuan"),
              ("张燎原", "Zhang Liaoyuan"),
          ]
          suffixes = {".cs", ".xaml", ".xml", ".md", ".txt", ".json", ".yml", ".yaml", ".ps1", ".props", ".targets", ".sln", ".csproj", ".html", ".js", ".css"}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in suffixes and path.name != 'LICENSE':
                  continue
              try:
                  text = path.read_text(encoding='utf-8-sig')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8-sig')
          Path('.github/workflows/sanitize-author-name.yml').unlink(missing_ok=True)
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Normalize author name to English only"
            git push origin HEAD:website
          fi
