name: Website Net10 Finalize Once

on:
  push:
    branches:
      - fix/website-net10-contract

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/website-net10-contract
          fetch-depth: 0

      - name: Finalize website .NET 10 contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8-sig', newline='\n')

          index = read('index.html')
          index = index.replace('Open CASCADE Technology 7.9.0 and .NET 8.', 'Open CASCADE Technology 7.9.0 and .NET 10.')
          index = index.replace('Open CASCADE Technology 7.9.0 to .NET 8 through a stable C ABI.', 'Open CASCADE Technology 7.9.0 to .NET 10 through a stable C ABI.')
          index = index.replace('<span>.NET 8</span>', '<span>.NET 10</span>')
          if '.NET 8' in index:
              raise SystemExit('Unexpected .NET 8 reference remains in index.html')
          write('index.html', index)

          app = read('app.js').replace('.NET 8', '.NET 10')
          if '.NET 8' in app:
              raise SystemExit('Unexpected .NET 8 reference remains in app.js')
          write('app.js', app)

          readme = read('README.md')
          if '## Project contract' not in readme:
              marker = '## Files\n'
              section = (
                  '## Project contract\n\n'
                  'The website describes the current `main` Bridge contract: Bridge **2.6.0**, Native ABI **3**, '
                  'OCCT **7.9.0**, .NET SDK **10.0.302**, target **`net10.0-windows`**, and C# **14.0**. '
                  '`main/bridge-contract.json` is authoritative; when those values change, the website content and website contract checks must change in the same update.\n\n'
              )
              if marker not in readme:
                  raise SystemExit('README.md insertion marker not found')
              readme = readme.replace(marker, section + marker, 1)
          write('README.md', readme)

          readme_zh = read('README.zh-CN.md')
          if '## 项目版本契约' not in readme_zh:
              marker = '## 文件结构\n'
              section = (
                  '## 项目版本契约\n\n'
                  '网站描述 `main` 当前 Bridge 契约：Bridge **2.6.0**、Native ABI **3**、OCCT **7.9.0**、'
                  '.NET SDK **10.0.302**、目标框架 **`net10.0-windows`**、C# **14.0**。'
                  '`main/bridge-contract.json` 是唯一权威来源；这些值变化时，网站内容与网站契约检查必须在同一次更新中同步修改。\n\n'
              )
              if marker not in readme_zh:
                  raise SystemExit('README.zh-CN.md insertion marker not found')
              readme_zh = readme_zh.replace(marker, section + marker, 1)
          write('README.zh-CN.md', readme_zh)

          workflow = read('.github/workflows/website-check.yml')
          old = '''          obsolete = [
              "tree/script",
              "git switch script",
              "OcctScript",
              "branchScript",
              "2.5.0",
              "ABI 2",
              "ABI=2",
          ]'''
          new = '''          obsolete = [
              "tree/script",
              "git switch script",
              "OcctScript",
              "branchScript",
              "2.5.0",
              "ABI 2",
              "ABI=2",
              ".NET 8",
              "net8.0-windows",
              "C# 12",
          ]'''
          if old not in workflow:
              raise SystemExit('website-check obsolete-token block not found')
          workflow = workflow.replace(old, new, 1)

          old = '''          occt_version = str(contract["occtVersion"])
          if occt_version not in index:
              raise SystemExit(f"Website does not contain contracted OCCT version {occt_version}")
'''
          new = '''          occt_version = str(contract["occtVersion"])
          if occt_version not in index:
              raise SystemExit(f"Website does not contain contracted OCCT version {occt_version}")

          dotnet = contract.get("dotnet", {})
          target_framework = str(dotnet.get("targetFramework", "")).strip()
          sdk_version = str(dotnet.get("sdkVersion", "")).strip()
          language_version = str(dotnet.get("languageVersion", "")).strip()
          if not target_framework or not sdk_version or not language_version:
              raise SystemExit("main bridge-contract.json has incomplete .NET metadata")
          major = target_framework.removeprefix("net").split(".", 1)[0]
          public_dotnet = f".NET {major}"
          if public_dotnet not in index or public_dotnet not in app:
              raise SystemExit(f"Website visitor-facing .NET version is stale; expected {public_dotnet}")
          for value, label in ((target_framework, "target framework"), (sdk_version, "SDK"), (f"C# {language_version}", "language version")):
              if value not in readmes:
                  raise SystemExit(f"Website README {label} is stale; expected {value}")
'''
          if old not in workflow:
              raise SystemExit('website-check OCCT contract block not found')
          workflow = workflow.replace(old, new, 1)
          workflow = workflow.replace('including contact metadata.', 'including .NET target/SDK/language and contact metadata.')
          write('.github/workflows/website-check.yml', workflow)
          PY

      - name: Commit finalized website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/website-net10-finalize-once.yml
          git add index.html app.js README.md README.zh-CN.md .github/workflows/website-check.yml
          git commit -m "Align website with .NET 10 bridge contract"
          git push origin HEAD:fix/website-net10-contract
