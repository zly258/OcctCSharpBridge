name: Patch modeling algorithm organization once

on:
  push:
    branches:
      - refactor/split-modeling-algorithms

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Patch modeling algorithm organization once')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/split-modeling-algorithms
          fetch-depth: 0

      - name: Patch organization contract
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/check-api-organization.ps1')
          text = path.read_text(encoding='utf-8-sig')

          replacements = [
              (
                  '    "src/OcctNet/OcctModelingSession.Algorithms.cs",\n',
                  '    "src/OcctNet/OcctModelingSession.Algorithms.Boolean.cs",\n'
                  '    "src/OcctNet/OcctModelingSession.Algorithms.Features.cs",\n'
                  '    "src/OcctNet/OcctModelingSession.Algorithms.Healing.cs",\n'
              ),
              (
                  '    "src/OcctNet/ModelNativeMethods.Analysis.cs",\n',
                  '    "src/OcctNet/ModelNativeMethods.Algorithms.Boolean.cs",\n'
                  '    "src/OcctNet/ModelNativeMethods.Algorithms.Features.cs",\n'
                  '    "src/OcctNet/ModelNativeMethods.Algorithms.Healing.cs",\n'
                  '    "src/OcctNet/ModelNativeMethods.History.cs",\n'
                  '    "src/OcctNet/ModelNativeMethods.Analysis.cs",\n'
              ),
              (
                  '    "src/OcctNet/ModelNativeMethods.Geometry.cs"\n',
                  '    "src/OcctNet/ModelNativeMethods.Geometry.cs",\n'
                  '    "src/OcctNet/OcctModelingSession.Algorithms.cs",\n'
                  '    "src/OcctNet/ModelNativeMethods.Algorithms.cs"\n'
              ),
              (
                  '    "src/OcctNet/OcctModelingSession.ShapeQueries.cs" = @(',
                  '    "src/OcctNet/OcctModelingSession.Algorithms.Boolean.cs" = @("public OcctModelAlgorithmResult Boolean(", "public OcctModelAlgorithmResult Fuse(", "public OcctModelAlgorithmResult Cut(", "public OcctModelAlgorithmResult Common(", "public OcctModelAlgorithmResult Section(", "public OcctModelAlgorithmResult Split(")\n'
                  '    "src/OcctNet/OcctModelingSession.Algorithms.Features.cs" = @("public OcctModelAlgorithmResult Extrude(", "public OcctModelAlgorithmResult Revolve(", "public OcctModelAlgorithmResult Sweep(", "public OcctModelAlgorithmResult Loft(", "public OcctModelAlgorithmResult FilletEdges(", "public OcctModelAlgorithmResult ChamferEdges(", "public OcctModelAlgorithmResult OffsetShape(", "public OcctModelAlgorithmResult MakeThickSolid(")\n'
                  '    "src/OcctNet/OcctModelingSession.Algorithms.Healing.cs" = @("public OcctModelAlgorithmResult UnifySameDomain(", "public OcctModelAlgorithmResult FixShape(")\n'
                  '    "src/OcctNet/ModelNativeMethods.Algorithms.Boolean.cs" = @("occt_model_boolean", "occt_model_split")\n'
                  '    "src/OcctNet/ModelNativeMethods.Algorithms.Features.cs" = @("occt_model_extrude", "occt_model_revolve", "occt_model_sweep", "occt_model_loft", "occt_model_fillet_edges", "occt_model_chamfer_edges", "occt_model_offset", "occt_model_thick_solid")\n'
                  '    "src/OcctNet/ModelNativeMethods.Algorithms.Healing.cs" = @("occt_model_unify_same_domain", "occt_model_fix_shape")\n'
                  '    "src/OcctNet/ModelNativeMethods.History.cs" = @("occt_model_history_generated_count", "occt_model_history_generated_at", "occt_model_history_modified_count", "occt_model_history_modified_at", "occt_model_history_is_removed")\n'
                  '    "src/OcctNet/OcctModelingSession.ShapeQueries.cs" = @('
              ),
              (
                  'Assert-NoResponsibilityTokens "src/OcctNet/OcctEngine.Features.cs"',
                  'Assert-NoResponsibilityTokens "src/OcctNet/OcctModelingSession.Algorithms.Boolean.cs" @("public OcctModelAlgorithmResult Extrude(", "public OcctModelAlgorithmResult FixShape(") "feature/healing"\n'
                  'Assert-NoResponsibilityTokens "src/OcctNet/OcctModelingSession.Algorithms.Features.cs" @("public OcctModelAlgorithmResult Boolean(", "public OcctModelAlgorithmResult FixShape(") "boolean/healing"\n'
                  'Assert-NoResponsibilityTokens "src/OcctNet/OcctModelingSession.Algorithms.Healing.cs" @("public OcctModelAlgorithmResult Boolean(", "public OcctModelAlgorithmResult Extrude(") "boolean/feature"\n'
                  'Assert-NoResponsibilityTokens "src/OcctNet/ModelNativeMethods.Algorithms.Boolean.cs" @("occt_model_extrude", "occt_model_fix_shape", "occt_model_history_") "feature/healing/history PInvoke"\n'
                  'Assert-NoResponsibilityTokens "src/OcctNet/ModelNativeMethods.Algorithms.Features.cs" @("occt_model_boolean", "occt_model_fix_shape", "occt_model_history_") "boolean/healing/history PInvoke"\n'
                  'Assert-NoResponsibilityTokens "src/OcctNet/ModelNativeMethods.Algorithms.Healing.cs" @("occt_model_boolean", "occt_model_extrude", "occt_model_history_") "boolean/feature/history PInvoke"\n'
                  'Assert-NoResponsibilityTokens "src/OcctNet/ModelNativeMethods.History.cs" @("occt_model_boolean", "occt_model_extrude", "occt_model_fix_shape") "algorithm PInvoke"\n\n'
                  'Assert-NoResponsibilityTokens "src/OcctNet/OcctEngine.Features.cs"'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replacement target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text('\ufeff' + text, encoding='utf-8')

      - name: Commit contract patch and remove workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-modeling-algorithm-organization-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/check-api-organization.ps1
          git commit -m "Protect modeling algorithm responsibility split"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refactor/split-modeling-algorithms
