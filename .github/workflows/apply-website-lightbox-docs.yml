name: Apply Website Lightbox Docs

on:
  push:
    branches:
      - update/website-lightbox-docs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/website-lightbox-docs
          fetch-depth: 0
      - name: Patch website
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8-sig')

          replace_once(
              'index.html',
              '<h2 data-i18n="startTitle">Validate the API, then build</h2>\n          <p data-i18n="startLead">Target environment: Windows x64, .NET 8 and exactly OCCT 7.9.0.</p>',
              '<h2 data-i18n="startTitle">Clone, build, run and publish</h2>\n          <p data-i18n="startLead">Start from a fresh clone, switch to the demo branch, configure OCCT_ROOT, then use the PowerShell scripts for validation, build, run, smoke testing and packaging.</p>')

          replace_once(
              'index.html',
              '<pre><code id="buildCode"># Validate API contracts\n.\\build.ps1 validate Release\n\n# Build native + managed bridge\n.\\build.ps1 all Release -OcctRoot "D:\\tools\\occt-vc144-64"\n\n# Run modeling smoke scenarios\n.\\build.ps1 smoke Release -OcctRoot "D:\\tools\\occt-vc144-64"</code></pre>',
              '<pre><code id="buildCode"># 1. Clone the repository\ngit clone https://github.com/zly258/OcctCSharpBridge.git\ncd OcctCSharpBridge\n\n# 2. Switch to the desktop demo branch\ngit switch demo\n\n# 3. Configure OCCT 7.9.0\n$env:OCCT_ROOT = "D:\\tools\\occt-vc144-64"\n\n# 4. Validate API contracts only\n.\\build.ps1 validate Release\n\n# 5. Build native bridge + all desktop demos\n.\\build.ps1 all Release\n\n# 6. Run a desktop demo\n.\\run.ps1 winform\n.\\run.ps1 wpf\n.\\run.ps1 avalonia\n\n# 7. Run native modeling smoke scenarios\n.\\build.ps1 smoke Release\n\n# 8. Publish deployment packages\n.\\publish.ps1 all Release -Zip</code></pre>')

          p = Path('app.js')
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace("startTitle: 'Validate the API, then build',", "startTitle: 'Clone, build, run and publish',", 1)
          text = text.replace("startLead: 'Target environment: Windows x64, .NET 8 and exactly OCCT 7.9.0.',", "startLead: 'Start from a fresh clone, switch to the demo branch, configure OCCT_ROOT, then use the PowerShell scripts for validation, build, run, smoke testing and packaging.',", 1)
          text = text.replace("startTitle: '先验证接口，再构建项目',", "startTitle: '从克隆开始：构建、运行与发布',", 1)
          text = text.replace("startLead: '目标环境：Windows x64、.NET 8，并精确使用 OCCT 7.9.0。',", "startLead: '建议从全新克隆开始，切换到 demo 分支，配置 OCCT_ROOT，再分别使用 PowerShell 脚本完成校核、构建、运行、Smoke 测试和发布。',", 1)

          needle = "  applyLanguage(language);\n})();"
          if needle not in text:
              raise SystemExit('Unable to locate app.js bootstrap end')
          lightbox = r'''  const previewImages = Array.from(document.querySelectorAll('.preview-card img'));
  if (previewImages.length) {
    const lightbox = document.createElement('div');
    lightbox.className = 'image-lightbox';
    lightbox.setAttribute('role', 'dialog');
    lightbox.setAttribute('aria-modal', 'true');
    lightbox.setAttribute('aria-label', 'Image preview');
    lightbox.hidden = true;
    lightbox.innerHTML = `
      <button class="image-lightbox-close" type="button" aria-label="Close image preview">×</button>
      <img class="image-lightbox-image" alt="" />
      <div class="image-lightbox-caption"></div>`;
    document.body.appendChild(lightbox);

    const lightboxImage = lightbox.querySelector('.image-lightbox-image');
    const lightboxCaption = lightbox.querySelector('.image-lightbox-caption');
    const lightboxClose = lightbox.querySelector('.image-lightbox-close');
    let lastFocusedImage = null;

    const closeLightbox = () => {
      if (lightbox.hidden) return;
      lightbox.hidden = true;
      document.body.classList.remove('lightbox-open');
      lightboxImage.removeAttribute('src');
      if (lastFocusedImage) lastFocusedImage.focus();
    };

    const openLightbox = (image) => {
      lastFocusedImage = image;
      lightboxImage.src = image.currentSrc || image.src;
      lightboxImage.alt = image.alt || '';
      const caption = image.closest('figure')?.querySelector('figcaption')?.innerText?.trim() || image.alt || '';
      lightboxCaption.textContent = caption;
      lightbox.hidden = false;
      document.body.classList.add('lightbox-open');
      lightboxClose.focus();
    };

    previewImages.forEach((image) => {
      image.classList.add('zoomable-image');
      image.tabIndex = 0;
      image.setAttribute('role', 'button');
      image.setAttribute('aria-label', `${image.alt || 'Preview image'} — open full size`);
      image.addEventListener('click', () => openLightbox(image));
      image.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openLightbox(image);
        }
      });
    });

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
    });
  }

  applyLanguage(language);
})();'''
          text = text.replace(needle, lightbox, 1)
          p.write_text(text, encoding='utf-8-sig')

          p = Path('styles.css')
          css = p.read_text(encoding='utf-8-sig')
          if '.image-lightbox {' not in css:
              css += r'''

/* Full-size preview for desktop demo screenshots */
.zoomable-image {
  cursor: zoom-in;
  transition: transform .2s ease, filter .2s ease;
}
.zoomable-image:hover { transform: scale(1.008); filter: brightness(1.02); }
.zoomable-image:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
body.lightbox-open { overflow: hidden; }
.image-lightbox[hidden] { display: none; }
.image-lightbox {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  grid-template-rows: 1fr auto;
  place-items: center;
  gap: 14px;
  padding: 58px 28px 26px;
  background: rgba(3, 7, 18, .88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.image-lightbox-image {
  display: block;
  max-width: min(94vw, 1800px);
  max-height: calc(100vh - 120px);
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 30px 90px rgba(0,0,0,.46);
  background: #0b1018;
}
.image-lightbox-caption {
  max-width: min(900px, 90vw);
  color: rgba(255,255,255,.78);
  font-size: 12px;
  text-align: center;
}
.image-lightbox-close {
  position: fixed;
  top: 18px;
  right: 22px;
  width: 38px;
  height: 38px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 999px;
  background: rgba(15,23,42,.72);
  color: #fff;
  font: 300 28px/34px system-ui, sans-serif;
  cursor: pointer;
}
.image-lightbox-close:hover,
.image-lightbox-close:focus-visible { background: rgba(30,41,59,.96); border-color: rgba(255,255,255,.3); outline: none; }
@media (max-width: 640px) {
  .image-lightbox { padding: 54px 12px 18px; }
  .image-lightbox-image { max-width: 96vw; max-height: calc(100vh - 105px); border-radius: 8px; }
  .image-lightbox-close { top: 10px; right: 10px; }
}
'''
          p.write_text(css, encoding='utf-8-sig')
          PY
      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/apply-website-lightbox-docs.yml
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "zly258"
          git config user.email "zhangly1403@qq.com"
          git add -A
          git commit -m "Add screenshot lightbox and complete getting started flow"
          git push origin HEAD:update/website-lightbox-docs
