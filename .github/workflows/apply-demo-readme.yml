name: Apply Demo README

on:
  push:
    branches:
      - update/demo-view-docs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/demo-view-docs
          fetch-depth: 0
      - run: python3 apply_demo_readme_patch.py
      - run: rm apply_demo_readme_patch.py .github/workflows/apply-demo-readme.yml
      - run: |
          git config user.name zly258
          git config user.email zhangly1403@qq.com
          git add -A
          git commit -m "Expand demo setup and script documentation"
          git push origin HEAD:update/demo-view-docs
