name: Bridge 2.6 Host Migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bridge-26-host-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Migrate reusable host object types
        shell: python
        run: |
          from pathlib import Path
          import re

          paths = []
          for root in [Path("src/OcctNet.WinForms"), Path("src/OcctNet.Wpf")]:
              paths.extend(root.rglob("*.cs"))
          paths.append(Path("tests/check-ui-hosts.ps1"))

          changed = []
          for path in paths:
              text = path.read_text(encoding="utf-8-sig")
              updated = re.sub(r"\bOcctObject\b", "IOcctObject", text)
              if updated != text:
                  path.write_text("\ufeff" + updated, encoding="utf-8")
                  changed.append(str(path))

          print("Migrated host files:")
          for item in changed:
              print(f"  {item}")

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/OcctNet.WinForms src/OcctNet.Wpf tests/check-ui-hosts.ps1
          if git diff --cached --quiet; then
            echo "Reusable hosts already use IOcctObject."
            exit 0
          fi
          git commit -m "Migrate reusable hosts to typed object API"
          git push origin HEAD:main
