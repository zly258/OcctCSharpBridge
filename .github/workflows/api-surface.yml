name: API Surface

on:
  push:
    branches:
      - main
      - agent/**
      - optimize/**
      - feature/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-surface-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate native and managed declarations
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Build managed core wrapper
        shell: pwsh
        run: dotnet build .\src\OcctNet\OcctNet.csproj -c Release -p:Platform=x64 --nologo

      - name: Build optional WinForms host
        shell: pwsh
        run: dotnet build .\src\OcctNet.WinForms\OcctNet.WinForms.csproj -c Release -p:Platform=x64 --nologo

      - name: Build optional WPF host
        shell: pwsh
        run: dotnet build .\src\OcctNet.Wpf\OcctNet.Wpf.csproj -c Release -p:Platform=x64 --nologo

      - name: Compile smoke test
        shell: pwsh
        run: dotnet build .\tests\OcctNet.Smoke\OcctNet.Smoke.csproj -c Release -p:Platform=x64 --nologo
