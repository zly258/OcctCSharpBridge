name: Apply Demo Batching

on:
  push:
    branches:
      - perf/batched-demo-loading

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[demo-batch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python tools/apply-demo-batching.py
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CadCommon/CadSession.cs src/CadCommon/ApiDemo.cs
          git commit -m "Batch WinForms and WPF sample loading [demo-batch-applied]"
          git push origin HEAD:perf/batched-demo-loading
