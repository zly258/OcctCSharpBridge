name: Public API Baseline Once

on:
  push:
    branches:
      - refactor/bridge-architecture-cleanup
    paths:
      - .github/workflows/public-api-baseline-once.yml

permissions:
  contents: write

jobs:
  approve:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout architecture cleanup branch
        uses: actions/checkout@v6
        with:
          ref: refactor/bridge-architecture-cleanup
          fetch-depth: 0

      - name: Generate and validate managed API baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $baseline = Join-Path (Resolve-Path '.').Path 'tests\OcctNet.ManagedTests\PublicApi.approved.txt'
          $env:OCCT_UPDATE_PUBLIC_API_SNAPSHOT = $baseline
          .\build.ps1 ci Release

          $text = [System.IO.File]::ReadAllText($baseline)
          if ($text.Contains('# BOOTSTRAP:')) {
            throw 'Public API baseline was not replaced by the generated signature snapshot.'
          }
          if (-not $text.Contains('ASSEMBLY OcctNet') -or
              -not $text.Contains('ASSEMBLY OcctNet.WinForms') -or
              -not $text.Contains('ASSEMBLY OcctNet.Wpf') -or
              -not $text.Contains('ASSEMBLY OcctNet.Avalonia')) {
            throw 'Generated public API baseline does not contain all reusable managed assemblies.'
          }

      - name: Commit approved baseline and remove workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/workflows/public-api-baseline-once.yml' -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/OcctNet.ManagedTests/PublicApi.approved.txt .github/workflows/public-api-baseline-once.yml
          git commit -m 'Approve managed public API signature baseline'
          git push origin HEAD:refactor/bridge-architecture-cleanup
