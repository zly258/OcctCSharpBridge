name: Demo Build

on:
  push:
    branches:
      - demo
  pull_request:
    branches:
      - demo

permissions:
  contents: read

concurrency:
  group: demo-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-demo:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Parse deployment scripts
        shell: pwsh
        run: |
          foreach ($path in @('.\run.ps1', '.\publish.ps1')) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $path),
                  [ref]$tokens,
                  [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $errors | Format-List
                  throw "PowerShell parse failed: $path"
              }
          }

      - name: Run demo CI build
        shell: pwsh
        run: .\build.ps1 ci Release
