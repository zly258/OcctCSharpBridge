name: Inertia Public API Once

on:
  push:
    branches:
      - feat/modeling-inertia-properties

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/modeling-inertia-properties
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Generate approved public API
        shell: pwsh
        run: |
          $env:OCCT_UPDATE_PUBLIC_API_SNAPSHOT = Join-Path $PWD "tests\OcctNet.ManagedTests\PublicApi.approved.txt"
          dotnet run --project tests\OcctNet.ManagedTests\OcctNet.ManagedTests.csproj -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Managed tests/public API generation failed." }

      - name: Commit snapshot and remove workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inertia-public-api-once.yml
          git add tests/OcctNet.ManagedTests/PublicApi.approved.txt
          git commit -m "Approve inertia public API snapshot"
          git push origin HEAD:feat/modeling-inertia-properties
