name: Demo Naming Cleanup Once

on:
  push:
    branches:
      - demo-occtdemo-naming
    paths:
      - .github/workflows/demo-naming-cleanup-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: demo-occtdemo-naming
          fetch-depth: 0

      - name: Validate renamed demo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1 validate Release
          .\build.ps1 managed Release

          $legacyPattern = '\bCad(Common|WinForms|Wpf|Avalonia|CommandId|ParameterKind|ParameterDefinition|CommandDefinition|CommandResult|CommandCatalog|HistoryEntry|Language|Localization|Values|IsoView|DepthBiasPreset|Session)\b'
          $scanFiles = @()
          foreach ($root in @('src')) {
            $scanFiles += Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @('.cs','.csproj','.xaml','.resx','.manifest','.md') }
          }
          foreach ($path in @(
            'OcctBridge.sln','build.ps1','run.ps1','publish.ps1','README.md','README.zh-CN.md',
            'tests/check-avalonia-host.ps1','tests/check-demo-command-preconditions.ps1',
            'tests/check-demo-package.ps1','tests/check-demo-ui-structure.ps1','.github/workflows/demo-build.yml'
          )) {
            if (Test-Path $path -PathType Leaf) { $scanFiles += Get-Item $path }
          }
          $legacy = $scanFiles | Sort-Object FullName -Unique | Select-String -Pattern $legacyPattern
          if ($legacy) {
            $legacy | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Legacy Cad-prefixed demo source naming remains.'
          }

          foreach ($project in @(
            'src/OcctDemo.Common/OcctDemo.Common.csproj',
            'src/OcctDemo.WinForms/OcctDemo.WinForms.csproj',
            'src/OcctDemo.Wpf/OcctDemo.Wpf.csproj',
            'src/OcctDemo.Avalonia/OcctDemo.Avalonia.csproj'
          )) {
            if (-not (Test-Path $project -PathType Leaf)) { throw "Missing renamed project: $project" }
            $text = Get-Content $project -Raw -Encoding UTF8
            if ($text -notmatch '<IsPackable>false</IsPackable>') { throw "Demo project must be explicitly non-packable: $project" }
          }

      - name: Remove one-time workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only
          git rm .github/workflows/demo-naming-cleanup-once.yml
          git commit -m 'Remove one-time demo naming cleanup workflow'
          git push origin HEAD:demo-occtdemo-naming
