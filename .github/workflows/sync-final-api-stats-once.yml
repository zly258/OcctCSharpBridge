name: Sync Final API Statistics Once

on:
  push:
    branches:
      - website
    paths:
      - .github/workflows/sync-final-api-stats-once.yml

permissions:
  contents: write

concurrency:
  group: website-final-api-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: website
          fetch-depth: 1

      - name: Update API statistics
        shell: pwsh
        run: |
          $path = 'index.html'
          $text = [System.IO.File]::ReadAllText($path)
          $pairs = @(
            @('<article><strong>345</strong><span data-i18n="statNative">Native C ABI</span></article>', '<article><strong>346</strong><span data-i18n="statNative">Native C ABI</span></article>'),
            @('<article><strong>345</strong><span data-i18n="statPInvoke">P/Invoke mappings</span></article>', '<article><strong>346</strong><span data-i18n="statPInvoke">P/Invoke mappings</span></article>'),
            @('<article><strong>90</strong><span data-i18n="statTypes">Public .NET types</span></article>', '<article><strong>94</strong><span data-i18n="statTypes">Public .NET types</span></article>')
          )
          foreach ($pair in $pairs) {
            if (-not $text.Contains($pair[0])) { throw "Expected statistic was not found: $($pair[0])" }
            $text = $text.Replace($pair[0], $pair[1])
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($true))
          Remove-Item '.github/workflows/sync-final-api-stats-once.yml'

      - name: Commit final website statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/sync-final-api-stats-once.yml
          git commit -m "Sync final API statistics"
          git push origin HEAD:website
