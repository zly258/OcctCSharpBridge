name: Apply Canonical API Documentation Names

on:
  push:
    branches:
      - docs/canonical-query-names

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Update documentation names
        shell: pwsh
        run: python .\.github\update_canonical_api_doc_names.py

      - name: Validate wrapper and documentation contracts
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Build managed wrapper
        shell: pwsh
        run: dotnet build .\src\OcctNet\OcctNet.csproj -c Release -p:Platform=x64 --nologo

      - name: Commit documentation update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows
          git add -A
          if (git diff --cached --quiet) { throw 'No documentation changes were produced.' }
          git commit -m "Use canonical query names in API documentation"
          git push origin HEAD:docs/canonical-query-names
