name: Wrapper Branch Sync

on:
  push:
    branches:
      - main
      - demo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wrapper-sync
  cancel-in-progress: true

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
          fetch-depth: 1

      - name: Checkout demo
        uses: actions/checkout@v6
        with:
          ref: demo
          path: demo
          fetch-depth: 1

      - name: Compare reusable wrapper source
        shell: pwsh
        run: |
          # Only reusable bridge source and machine-readable build contracts must stay synchronized.
          # Branch-specific docs, tests, project packaging metadata, build/publish scripts, and demo
          # application code are intentionally independent.
          $fixedPaths = @(
            ".editorconfig",
            ".gitattributes",
            "global.json",
            "bridge-contract.json",
            "Directory.Build.props",
            "src/OcctNative"
          )

          $failed = $false
          foreach ($path in $fixedPaths) {
            Write-Host "[sync] Comparing $path" -ForegroundColor Cyan
            & git diff --no-index --exit-code -- "main/$path" "demo/$path"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          foreach ($directory in @("src/OcctNet", "src/OcctNet.WinForms", "src/OcctNet.Wpf", "src/OcctNet.Avalonia")) {
            $mainRoot = Join-Path "main" $directory
            $demoRoot = Join-Path "demo" $directory
            $mainFiles = @(
              Get-ChildItem $mainRoot -Filter "*.cs" -File -Recurse |
                ForEach-Object { $_.FullName.Substring((Resolve-Path $mainRoot).Path.Length + 1).Replace('\', '/') } |
                Sort-Object
            )
            $demoFiles = @(
              Get-ChildItem $demoRoot -Filter "*.cs" -File -Recurse |
                ForEach-Object { $_.FullName.Substring((Resolve-Path $demoRoot).Path.Length + 1).Replace('\', '/') } |
                Sort-Object
            )

            if (Compare-Object $mainFiles $demoFiles) {
              Write-Host "[sync] C# file set differs in $directory" -ForegroundColor Red
              Compare-Object $mainFiles $demoFiles | Format-Table
              $failed = $true
              continue
            }

            foreach ($relative in $mainFiles) {
              $mainFile = Join-Path $mainRoot $relative
              $demoFile = Join-Path $demoRoot $relative
              & git diff --no-index --exit-code -- $mainFile $demoFile
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          }

          if ($failed) {
            throw "main and demo reusable bridge source are not synchronized."
          }
          Write-Host "main and demo reusable bridge source are synchronized; branch-specific docs, tests, packaging, and application code remain intentionally independent." -ForegroundColor Green
