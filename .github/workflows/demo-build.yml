name: Demo Build

on:
  push:
    branches:
      - demo
      - agent/**
      - optimize/**
  pull_request:
    branches:
      - demo

jobs:
  managed-demo:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate reusable wrapper contracts
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Validate deployment-complete package contract
        shell: pwsh
        run: .\tests\check-demo-package.ps1 -RepositoryRoot $PWD

      - name: Build reusable core wrapper
        shell: pwsh
        run: dotnet build .\src\OcctNet\OcctNet.csproj -c Release -p:Platform=x64 --nologo

      - name: Build optional WinForms host
        shell: pwsh
        run: dotnet build .\src\OcctNet.WinForms\OcctNet.WinForms.csproj -c Release -p:Platform=x64 --nologo

      - name: Build shared demo layer
        shell: pwsh
        run: dotnet build .\src\CadCommon\CadCommon.csproj -c Release -p:Platform=x64 --nologo

      - name: Build WinForms demo
        shell: pwsh
        run: dotnet build .\src\CadWinForms\CadWinForms.csproj -c Release -p:Platform=x64 --nologo

      - name: Build WPF demo
        shell: pwsh
        run: dotnet build .\src\CadWpf\CadWpf.csproj -c Release -p:Platform=x64 --nologo

      - name: Compile modeling smoke test
        shell: pwsh
        run: dotnet build .\tests\OcctNet.Smoke\OcctNet.Smoke.csproj -c Release -p:Platform=x64 --nologo
