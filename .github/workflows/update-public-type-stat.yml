name: Update Public Type Statistic

on:
  push:
    branches:
      - website
    paths:
      - .github/workflows/update-public-type-stat.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: website

      - name: Update statistic and remove migration workflow
        shell: pwsh
        run: |
          $path = 'index.html'
          $text = [System.IO.File]::ReadAllText($path)
          $old = '<article><strong>81</strong><span data-i18n="statTypes">Public .NET types</span></article>'
          $new = '<article><strong>82</strong><span data-i18n="statTypes">Public .NET types</span></article>'
          if (-not $text.Contains($old)) {
            throw 'Expected public type statistic was not found.'
          }
          [System.IO.File]::WriteAllText($path, $text.Replace($old, $new), [System.Text.UTF8Encoding]::new($true))
          Remove-Item '.github/workflows/update-public-type-stat.yml'

      - name: Commit website statistic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-public-type-stat.yml
          git commit -m "Sync website public type statistic"
          git push origin HEAD:website
