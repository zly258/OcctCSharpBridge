name: Apply WinForms Splitter Layout Fix

on:
  push:
    branches:
      - fix/winforms-splitter-layout

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[splitter-layout-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/winforms-splitter-layout
          fetch-depth: 0
      - name: Apply splitter layout patch
        run: python tools/patch-winforms-splitter.py
      - name: Build WinForms demo
        shell: pwsh
        run: |
          dotnet build .\src\CadCommon\CadCommon.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\src\CadWinForms\CadWinForms.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CadWinForms/MainForm.cs
          git commit -m "Defer invalid WinForms splitter layout [splitter-layout-applied]"
          git push
