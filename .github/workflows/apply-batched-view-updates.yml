name: Apply Batched View Updates

on:
  push:
    branches:
      - perf/batched-view-updates

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[batch-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python tools/apply-batched-view-updates.py
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/OcctNative/OcctInternal.hxx src/OcctNative/OcctNative.h src/OcctNative/OcctEngine.cpp src/OcctNet/BatchNativeMethods.cs src/OcctNet/OcctEngine.Batch.cs
          git commit -m "Add batched viewer updates [batch-patch-applied]"
          git push origin HEAD:perf/batched-view-updates
