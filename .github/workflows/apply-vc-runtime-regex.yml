name: Apply VC Runtime Regex Fix

on:
  push:
    branches:
      - demo

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Run VC runtime regex correction')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply regex correction
        shell: pwsh
        run: python .\.github\fix_vc_runtime_regex.py

      - name: Parse and validate package scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path .\publish.ps1),
              [ref]$tokens,
              [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | Format-List
              throw 'publish.ps1 parse failed.'
          }
          .\tests\check-demo-package.ps1 -RepositoryRoot $PWD

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows
          git add -A
          if (git diff --cached --quiet) { throw 'No regex correction was produced.' }
          git commit -m "Correct VC runtime ranking regexes"
          git push origin HEAD:demo
