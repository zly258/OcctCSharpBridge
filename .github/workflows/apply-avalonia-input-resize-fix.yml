name: Apply Avalonia Input Resize Fix

on:
  push:
    branches:
      - demo

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add temporary Avalonia interaction fix workflow'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo
          fetch-depth: 0
      - name: Patch Avalonia native host
        shell: pwsh
        run: |
          $path = 'src/OcctNet.Avalonia/OcctAvaloniaViewport.cs'
          $text = [System.IO.File]::ReadAllText($path)

          $text = $text.Replace('    private const int WsClipChildren = 0x02000000;\r\n', '    private const int WsClipChildren = 0x02000000;\r\n    private const int SsNotify = 0x00000100;\r\n\r\n    private const uint WmSize = 0x0005;\r\n    private const uint WmWindowPosChanged = 0x0047;\r\n')
          $text = $text.Replace('    private long _lastWorldPointTimestamp;\r\n', '    private long _lastWorldPointTimestamp;\r\n    private bool _nativeRefreshScheduled;\r\n')
          $text = $text.Replace('            WsChild | WsVisible | WsClipSiblings | WsClipChildren,', '            WsChild | WsVisible | WsClipSiblings | WsClipChildren | SsNotify,')
          $text = $text.Replace('        SynchronizeDpi();\r\n        TryInvoke(_engine.Resize);\r\n        TryInvoke(_engine.Redraw);', '        SynchronizeDpi();\r\n        TryInvoke(_engine.Resize);\r\n        TryInvoke(_engine.Redraw);')
          $text = $text.Replace('        RefreshNativeView();\r\n    }\r\n\r\n    private IntPtr WindowProcedure', '        ScheduleNativeViewRefresh();\r\n    }\r\n\r\n    private void ScheduleNativeViewRefresh()\r\n    {\r\n        if (_nativeRefreshScheduled || _engine?.IsInitialized != true || _nativeHandle == IntPtr.Zero)\r\n            return;\r\n\r\n        _nativeRefreshScheduled = true;\r\n        Dispatcher.UIThread.Post(() =>\r\n        {\r\n            _nativeRefreshScheduled = false;\r\n            RefreshNativeView();\r\n        }, DispatcherPriority.Background);\r\n    }\r\n\r\n    private IntPtr WindowProcedure')
          $text = $text.Replace('            switch (message)\r\n            {\r\n                case WmDpiChanged:', '            switch (message)\r\n            {\r\n                case WmSize:\r\n                case WmWindowPosChanged:\r\n                    ScheduleNativeViewRefresh();\r\n                    break;\r\n\r\n                case WmDpiChanged:')
          $text = $text.Replace('                case WmRButtonUp:\r\n                    _rotating = false;\r\n                    break;', '                case WmRButtonUp:\r\n                    _rotating = false;\r\n                    ReleaseCapture();\r\n                    break;')
          $text = $text.Replace('                case WmMButtonUp:\r\n                    _panning = false;\r\n                    break;', '                case WmMButtonUp:\r\n                    _panning = false;\r\n                    ReleaseCapture();\r\n                    break;')
          $text = $text.Replace('                    HandleMouseWheel(wParam);', '                    HandleMouseWheel(wParam, lParam);')
          $text = $text.Replace('                case WmCaptureChanged:\r\n                    if (wParam != hwnd)', '                case WmCaptureChanged:\r\n                    if (lParam != hwnd)')
          $text = $text.Replace('        _rotating = true;\r\n        TryInvoke(() => _engine.StartRotation(x, y));', '        _rotating = true;\r\n        SetCapture(hwnd);\r\n        TryInvoke(() => _engine.StartRotation(x, y));')
          $text = $text.Replace('        _panning = true;\r\n    }', '        _panning = true;\r\n        SetCapture(hwnd);\r\n    }')
          $text = $text.Replace('    private void HandleMouseWheel(IntPtr wParam)\r\n    {', '    private void HandleMouseWheel(IntPtr wParam, IntPtr lParam)\r\n    {')
          $text = $text.Replace('        TryInvoke(() => _engine.Zoom(delta > 0 ? 1.15 : 0.87));\r\n    }', '        var point = new NativePoint(GetLowWordSigned(lParam), GetHighWordSigned(lParam));\r\n        if (_nativeHandle != IntPtr.Zero && ScreenToClient(_nativeHandle, ref point))\r\n            TryInvoke(() => _engine.ZoomAtPoint(point.X, point.Y, delta));\r\n        else\r\n            TryInvoke(() => _engine.Zoom(delta > 0 ? 1.15 : 0.87));\r\n    }')
          $text = $text.Replace('        _nativeHandle = IntPtr.Zero;\r\n        _selectionFrame = null;', '        _nativeHandle = IntPtr.Zero;\r\n        _selectionFrame = null;\r\n        _nativeRefreshScheduled = false;')
          $text = $text.Replace('    private readonly record struct SelectionFrame(int Left, int Top, int Right, int Bottom);', '    private readonly record struct SelectionFrame(int Left, int Top, int Right, int Bottom);\r\n\r\n    [StructLayout(LayoutKind.Sequential)]\r\n    private struct NativePoint\r\n    {\r\n        public NativePoint(int x, int y)\r\n        {\r\n            X = x;\r\n            Y = y;\r\n        }\r\n\r\n        public int X;\r\n        public int Y;\r\n    }')
          $text = $text.Replace('    [DllImport("user32.dll")]\r\n    private static extern uint GetDpiForWindow(IntPtr hwnd);', '    [DllImport("user32.dll")]\r\n    private static extern uint GetDpiForWindow(IntPtr hwnd);\r\n\r\n    [DllImport("user32.dll")]\r\n    private static extern bool ScreenToClient(IntPtr hwnd, ref NativePoint point);')

          if (-not $text.Contains('SsNotify') -or -not $text.Contains('WmSize') -or -not $text.Contains('ZoomAtPoint') -or -not $text.Contains('ScheduleNativeViewRefresh')) { throw 'Avalonia patch markers missing.' }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($true))

          $testPath = 'tests/check-ui-hosts.ps1'
          $test = [System.IO.File]::ReadAllText($testPath)
          $test = $test.Replace('$wpfControl = Join-Path $RepositoryRoot "src\\OcctNet.Wpf\\OcctWpfViewport.cs"', '$wpfControl = Join-Path $RepositoryRoot "src\\OcctNet.Wpf\\OcctWpfViewport.cs"`r`n$avaloniaControl = Join-Path $RepositoryRoot "src\\OcctNet.Avalonia\\OcctAvaloniaViewport.cs"')
          $test = $test.Replace('foreach ($path in @($winFormsProject, $wpfProject, $wpfControl))', 'foreach ($path in @($winFormsProject, $wpfProject, $wpfControl, $avaloniaControl))')
          $insert = @'

$avaloniaText = [System.IO.File]::ReadAllText($avaloniaControl)
foreach ($token in @(
    'SsNotify',
    'WmSize',
    'WmWindowPosChanged',
    'ScheduleNativeViewRefresh',
    'SetCapture(hwnd)',
    'ScreenToClient',
    'ZoomAtPoint',
    'if (lParam != hwnd)'
)) {
    if (-not $avaloniaText.Contains($token)) {
        throw "Avalonia native viewport interaction/resize contract is missing: $token"
    }
}
'@
          $test = $test.Replace('Write-Host "[ui-hosts] WinForms and WPF viewport host contracts validated." -ForegroundColor Green', $insert + "`r`nWrite-Host \"[ui-hosts] WinForms, WPF and Avalonia viewport host contracts validated.\" -ForegroundColor Green")
          [System.IO.File]::WriteAllText($testPath, $test, [System.Text.UTF8Encoding]::new($true))
      - name: Remove temporary workflow
        shell: pwsh
        run: Remove-Item '.github/workflows/apply-avalonia-input-resize-fix.yml'
      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "zly258"
          git config user.email "zhangly1403@qq.com"
          git add -A
          git commit -m "Fix Avalonia native viewport input and resize"
          git push origin HEAD:demo
