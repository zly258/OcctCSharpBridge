name: Add Topology Analysis Check Once

on:
  push:
    branches:
      - demo
    paths:
      - .github/workflows/add-topology-check-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: demo

      - name: Add topology analysis validation and remove migration workflow
        shell: pwsh
        run: |
          $path = 'build.ps1'
          $text = [System.IO.File]::ReadAllText($path)
          $anchor = '    Geometry = "tests\check-geometry-api.ps1"'
          $entry = '    TopologyAnalysis = "tests\check-topology-analysis.ps1"'
          if (-not $text.Contains($entry)) {
              if (-not $text.Contains($anchor)) { throw 'Geometry check anchor was not found in build.ps1.' }
              $text = $text.Replace($anchor, "$anchor`r`n$entry")
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($true))
          Remove-Item '.github/workflows/add-topology-check-once.yml'

      - name: Commit build validation wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.ps1 .github/workflows/add-topology-check-once.yml
          git commit -m "Run topology analysis contract checks"
          git push origin HEAD:demo
