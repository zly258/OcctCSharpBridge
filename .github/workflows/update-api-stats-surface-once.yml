name: Update B-Spline Surface API Statistics Once

on:
  push:
    branches:
      - website
    paths:
      - .github/workflows/update-api-stats-surface-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: website

      - name: Update statistics and remove migration workflow
        shell: pwsh
        run: |
          $path = 'index.html'
          $text = [System.IO.File]::ReadAllText($path)
          foreach ($pair in @(
              @('<article><strong>339</strong><span data-i18n="statNative">Native C ABI</span></article>', '<article><strong>343</strong><span data-i18n="statNative">Native C ABI</span></article>'),
              @('<article><strong>339</strong><span data-i18n="statPInvoke">P/Invoke mappings</span></article>', '<article><strong>343</strong><span data-i18n="statPInvoke">P/Invoke mappings</span></article>'),
              @('<article><strong>83</strong><span data-i18n="statTypes">Public .NET types</span></article>', '<article><strong>84</strong><span data-i18n="statTypes">Public .NET types</span></article>')
          )) {
              if (-not $text.Contains($pair[0])) { throw "Expected website statistic not found: $($pair[0])" }
              $text = $text.Replace($pair[0], $pair[1])
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($true))
          Remove-Item '.github/workflows/update-api-stats-surface-once.yml'

      - name: Commit website statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-api-stats-surface-once.yml
          git commit -m "Sync B-Spline surface API statistics"
          git push origin HEAD:website
