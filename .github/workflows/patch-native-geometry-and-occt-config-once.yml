name: Patch native geometry and OCCT config once

on:
  push:
    branches:
      - refactor/split-native-modeling-geometry

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Patch native geometry and OCCT config once')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/split-native-modeling-geometry
          fetch-depth: 0

      - name: Patch build configuration and structure contracts
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text('\ufeff' + text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one target, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          replace_once(
              'src/OcctNative/CMakeLists.txt',
              '    OcctModelingGeometry.cpp\n',
              '    OcctModelingGeometry.Curves.cpp\n'
              '    OcctModelingGeometry.Planar.cpp\n'
              '    OcctModelingGeometry.Primitives.cpp\n'
              '    OcctModelingGeometry.Assembly.cpp\n'
              '    OcctModelingGeometry.Transform.cpp\n')

          replace_once(
              'src/OcctNative/CMakeLists.txt',
              '''set(OCCT_ROOT "$ENV{OCCT_ROOT}" CACHE PATH "OCCT installation root")
if(NOT OCCT_ROOT)
    message(FATAL_ERROR "OCCT_ROOT is not configured. Pass -DOCCT_ROOT=<path> or set the OCCT_ROOT environment variable.")
endif()
''',
              '''set(OCCT_DEFAULT_ROOT "D:/tools/occt-vc144-64" CACHE PATH "Default OCCT installation root used when OCCT_ROOT is not supplied")
set(OCCT_ROOT "$ENV{OCCT_ROOT}" CACHE PATH "OCCT installation root")
if(NOT OCCT_ROOT AND OCCT_DEFAULT_ROOT)
    set(OCCT_ROOT "${OCCT_DEFAULT_ROOT}" CACHE PATH "OCCT installation root" FORCE)
endif()
if(NOT OCCT_ROOT OR NOT EXISTS "${OCCT_ROOT}")
    message(FATAL_ERROR "OCCT SDK root was not found: '${OCCT_ROOT}'. Set OCCT_ROOT, pass -DOCCT_ROOT=<path>, or install OCCT at ${OCCT_DEFAULT_ROOT}.")
endif()
''')

          replace_once(
              'src/OcctNative/CMakeLists.txt',
              '''    TKService TKV3d TKOpenGl TKXSBase TKDE TKDESTEP TKDEIGES TKDESTL
    TKSTEPBase TKSTEPAttr TKSTEP209 TKSTEP TKIGES)''',
              '''    TKService TKV3d TKOpenGl TKXSBase TKDE TKDESTEP TKDEIGES TKDESTL)''')

          replace_once(
              'build.ps1',
              '''$Target = $Target.ToLowerInvariant()
$RepoRoot = Split-Path -Parent $MyInvocation.MyCommand.Path
''',
              '''$Target = $Target.ToLowerInvariant()
$RepoRoot = Split-Path -Parent $MyInvocation.MyCommand.Path
$DefaultOcctRoot = "D:\\tools\\occt-vc144-64"
if ([string]::IsNullOrWhiteSpace($OcctRoot)) {
    $OcctRoot = $DefaultOcctRoot
}
''')

          replace_once(
              'build.ps1',
              '''function Resolve-OcctConfiguration {
    if ([string]::IsNullOrWhiteSpace($OcctRoot)) {
        throw "OCCT_ROOT is not configured. Pass -OcctRoot <path> or set the OCCT_ROOT environment variable."
    }

    $script:OcctRoot = [System.IO.Path]::GetFullPath($OcctRoot)
''',
              '''function Resolve-OcctConfiguration {
    $script:OcctRoot = [System.IO.Path]::GetFullPath($OcctRoot)
    if (-not (Test-Path $script:OcctRoot -PathType Container)) {
        throw "OCCT SDK root was not found: $script:OcctRoot. Set OCCT_ROOT, pass -OcctRoot <path>, or install OCCT at $DefaultOcctRoot. validate/managed/pack/ci do not require OCCT."
    }
''')

          replace_once(
              'build.ps1',
              '''if ([string]::IsNullOrWhiteSpace($OcctRoot)) {
    Write-Host "OCCT root:     not configured (valid for validate/managed/pack/ci)" -ForegroundColor DarkGray
}
else {
    Write-Host "OCCT root:     $OcctRoot" -ForegroundColor DarkGray
}
''',
              '''$occtRootSource = if ($env:OCCT_ROOT) { "environment" } elseif ($OcctRoot -eq $DefaultOcctRoot) { "default" } else { "argument" }
Write-Host "OCCT root:     $OcctRoot ($occtRootSource)" -ForegroundColor DarkGray
''')

          test_path = 'tests/check-native-build-structure.ps1'
          test_text = read(test_path)
          insertion = r'''
$geometryModules = @(
    @{ File = "OcctModelingGeometry.Curves.cpp"; Symbols = @("occt_model_make_vertex", "occt_model_make_line", "occt_model_make_circle", "occt_model_make_bspline_interpolated") },
    @{ File = "OcctModelingGeometry.Planar.cpp"; Symbols = @("occt_model_make_regular_polygon", "occt_model_make_rectangle_wire", "occt_model_make_plane_face", "occt_model_make_face_from_wire") },
    @{ File = "OcctModelingGeometry.Primitives.cpp"; Symbols = @("occt_model_make_box", "occt_model_make_cylinder", "occt_model_make_sphere", "occt_model_make_torus") },
    @{ File = "OcctModelingGeometry.Assembly.cpp"; Symbols = @("occt_model_make_compound", "occt_model_make_wire", "occt_model_make_solid_from_shell") },
    @{ File = "OcctModelingGeometry.Transform.cpp"; Symbols = @("occt_model_translate", "occt_model_rotate", "occt_model_scale", "occt_model_mirror_plane") }
)
foreach ($module in $geometryModules) {
    if ($module.File -notin $sourceTokens) {
        throw "Split native modeling geometry module is not listed in add_library: $($module.File)"
    }
    $moduleText = [System.IO.File]::ReadAllText((Join-Path $nativeRoot $module.File))
    if ($moduleText.Contains('#include "OcctModelingInternal.hxx"')) {
        throw "$($module.File) depends on the broad modeling compatibility umbrella."
    }
    foreach ($symbol in $module.Symbols) {
        if (-not $moduleText.Contains($symbol)) {
            throw "Split native modeling geometry module $($module.File) is missing expected responsibility symbol: $symbol"
        }
    }
}
if ("OcctModelingGeometry.cpp" -in $sourceTokens -or (Test-Path (Join-Path $nativeRoot "OcctModelingGeometry.cpp"))) {
    throw "Legacy OcctModelingGeometry.cpp must remain removed after the five-way native geometry split."
}

foreach ($legacyToolkit in @("TKSTEPBase", "TKSTEPAttr", "TKSTEP209", "TKSTEP", "TKIGES")) {
    if ($text.Contains($legacyToolkit)) {
        throw "Legacy pre-7.9 data-exchange toolkit remains in native CMake dependencies: $legacyToolkit"
    }
}
foreach ($requiredToolkit in @("TKDESTEP", "TKDEIGES", "TKDESTL")) {
    if (-not $text.Contains($requiredToolkit)) {
        throw "Required OCCT 7.9 data-exchange toolkit is missing from native CMake dependencies: $requiredToolkit"
    }
}

$buildScriptText = [System.IO.File]::ReadAllText((Join-Path $RepositoryRoot "build.ps1"))
if (-not $buildScriptText.Contains('D:\tools\occt-vc144-64')) {
    throw "build.ps1 must provide the repository's conventional OCCT default root."
}
if (-not $buildScriptText.Contains('validate/managed/pack/ci do not require OCCT')) {
    throw "build.ps1 must preserve OCCT-optional managed/validation targets."
}

'''
          marker = '$modules = @(\n'
          if test_text.count(marker) != 1:
              raise SystemExit(f'{test_path}: expected one modules marker, found {test_text.count(marker)}')
          test_text = test_text.replace(marker, insertion + marker, 1)
          test_text = test_text.replace(
              '$($modelingInternalHeaders.Count) modeling internal layers, and $($modules.Count) dedicated modeling modules validated;',
              '$($modelingInternalHeaders.Count) modeling internal layers, $($geometryModules.Count) split modeling geometry modules, and $($modules.Count) dedicated modeling modules validated;',
              1)
          write(test_path, test_text)

      - name: Commit patch and remove workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-native-geometry-and-occt-config-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.ps1 src/OcctNative/CMakeLists.txt tests/check-native-build-structure.ps1
          git commit -m "Fix OCCT 7.9 toolkit detection and geometry structure"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refactor/split-native-modeling-geometry
