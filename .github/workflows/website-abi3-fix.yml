name: Website ABI 3 Fix

on:
  push:
    branches:
      - website
    paths:
      - .github/workflows/website-abi3-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: website
          fetch-depth: 0

      - name: Finalize ABI metadata
        shell: python
        run: |
          from pathlib import Path

          files = [Path("index.html"), Path("app.js"), Path("README.md"), Path("README.zh-CN.md")]
          found = False
          for path in files:
              text = path.read_text(encoding="utf-8-sig")
              updated = text.replace("ABI 2", "ABI 3").replace("ABI=2", "ABI=3")
              if updated != text:
                  path.write_text("\ufeff" + updated, encoding="utf-8")
                  found = True

          combined = "\n".join(path.read_text(encoding="utf-8-sig") for path in files)
          for obsolete in ["ABI 2", "ABI=2", "2.5.0", ">339<"]:
              if obsolete in combined:
                  raise SystemExit(f"Obsolete website metadata remains: {obsolete}")
          if not found:
              print("Website ABI metadata already current.")

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js README.md README.zh-CN.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize website ABI 3 metadata"
          git push origin HEAD:website
