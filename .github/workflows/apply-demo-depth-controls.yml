name: Apply Demo Depth Controls

on:
  push:
    branches:
      - fix/demo-z-fighting-controls

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[demo-depth-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/demo-z-fighting-controls
          fetch-depth: 0
      - name: Apply source patch
        run: python tools/patch-demo-depth-controls.py
      - name: Build managed Demo projects
        shell: pwsh
        run: |
          dotnet build .\src\CadCommon\CadCommon.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\src\CadWinForms\CadWinForms.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\src\CadWpf\CadWpf.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit patched sources
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md src/CadCommon/CadSession.cs src/CadCommon/CadLocalization.cs src/CadWinForms/MainForm.cs src/CadWpf/MainWindow.xaml.cs
          git commit -m "Add WinForms and WPF coplanar depth controls [demo-depth-applied]"
          git push
