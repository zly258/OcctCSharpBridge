name: Apply WPF And Batch API 2.2

on:
  push:
    branches:
      - feature/wpf-and-batch-api-2.2

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare inventory migration
        shell: pwsh
        run: |
          $path = '.\.github\apply_wpf_batch_2_2.py'
          $text = Get-Content $path -Raw
          $text = $text.Replace(
            'The `OcctViewport*` types above are provided by the optional `OcctNet.WinForms` assembly; all remaining managed types stay in the UI-independent `OcctNet` assembly.',
            'The `OcctViewport*` types above are provided by the optional `OcctNet.WinForms` assembly; all other managed types remain in the UI-independent `OcctNet` assembly.')
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, [System.Text.UTF8Encoding]::new($true))

      - name: Apply WPF and batch API integration
        shell: pwsh
        run: python .\.github\apply_wpf_batch_2_2.py

      - name: Validate reusable wrapper
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Build managed projects
        shell: pwsh
        run: |
          dotnet build .\src\OcctNet\OcctNet.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'OcctNet build failed.' }
          dotnet build .\src\OcctNet.WinForms\OcctNet.WinForms.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'OcctNet.WinForms build failed.' }
          dotnet build .\src\OcctNet.Wpf\OcctNet.Wpf.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'OcctNet.Wpf build failed.' }
          dotnet build .\tests\OcctNet.Smoke\OcctNet.Smoke.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Smoke project build failed.' }

      - name: Check patch quality
        shell: pwsh
        run: git diff --check

      - name: Commit integrated wrapper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows
          git add -A
          if (git diff --cached --quiet) { throw 'No integration changes were produced.' }
          git commit -m "Add reusable WPF host and batch object APIs"
          git push origin HEAD:feature/wpf-and-batch-api-2.2
