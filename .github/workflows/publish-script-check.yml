name: Publish Script Check

on:
  push:
    branches:
      - demo
      - optimize/**
  pull_request:
    branches:
      - demo

jobs:
  validate-publish-script:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse package scripts
        shell: pwsh
        run: |
          foreach ($path in @(
              '.\publish.ps1',
              '.\tests\check-demo-package.ps1'
          )) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $path),
                  [ref]$tokens,
                  [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $errors | Format-List
                  throw "PowerShell parse failed: $path"
              }
          }

      - name: Verify publishing inputs
        shell: pwsh
        run: |
          $required = @(
              '.\publish.ps1',
              '.\build.ps1',
              '.\tests\check-demo-package.ps1',
              '.\tests\check-native-build-structure.ps1',
              '.\tests\check-selection-contract.ps1',
              '.\tests\check-viewport-api.ps1',
              '.\src\OcctNet.WinForms\OcctNet.WinForms.csproj',
              '.\src\CadWinForms\CadWinForms.csproj',
              '.\src\CadWpf\CadWpf.csproj'
          )
          foreach ($path in $required) {
              if (-not (Test-Path $path -PathType Leaf)) {
                  throw "Required publishing input was not found: $path"
              }
          }

      - name: Verify modular project references
        shell: pwsh
        run: |
          foreach ($project in @(
              '.\src\CadWinForms\CadWinForms.csproj',
              '.\src\CadWpf\CadWpf.csproj'
          )) {
              $text = Get-Content $project -Raw
              if (-not $text.Contains('..\OcctNet.WinForms\OcctNet.WinForms.csproj')) {
                  throw "The demo project does not reference the optional WinForms host: $project"
              }
          }

      - name: Validate deployment-complete package contract
        shell: pwsh
        run: .\tests\check-demo-package.ps1 -RepositoryRoot $PWD
