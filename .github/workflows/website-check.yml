name: Website Check

on:
  push:
    branches:
      - website
  pull_request:
    branches:
      - website

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout website
        uses: actions/checkout@v6
        with:
          path: site

      - name: Checkout main contract
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
          fetch-depth: 1

      - name: Validate JavaScript syntax
        working-directory: site
        run: node --check app.js

      - name: Validate website contracts
        working-directory: site
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          required_files = [
              Path("index.html"),
              Path("styles.css"),
              Path("app.js"),
              Path("README.md"),
              Path("README.zh-CN.md"),
              Path(".nojekyll"),
          ]
          missing = [str(path) for path in required_files if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing website files: {', '.join(missing)}")

          contract_path = Path("../main/bridge-contract.json")
          if not contract_path.is_file():
              raise SystemExit("main/bridge-contract.json was not checked out")
          contract = json.loads(contract_path.read_text(encoding="utf-8-sig"))

          text_files = required_files[:-1]
          content = "\n".join(path.read_text(encoding="utf-8-sig") for path in text_files)
          obsolete = ["tree/script", "git switch script", "OcctScript", "branchScript"]
          found = [token for token in obsolete if token in content]
          if found:
              raise SystemExit(f"Obsolete script branch references found: {', '.join(found)}")

          index = Path("index.html").read_text(encoding="utf-8-sig")
          app = Path("app.js").read_text(encoding="utf-8-sig")
          keys = sorted(set(re.findall(r'data-i18n="([A-Za-z0-9_]+)"', index)))
          missing_keys = [key for key in keys if len(re.findall(rf"\b{re.escape(key)}\s*:", app)) < 2]
          if missing_keys:
              raise SystemExit(f"Missing bilingual translation keys: {', '.join(missing_keys)}")

          expected_stats = {
              "statNative": str(contract["api"]["nativeExports"]),
              "statPInvoke": str(contract["api"]["managedPInvokes"]),
              "statTypes": str(contract["api"]["publicNetTypes"]),
              "statVersion": str(contract["bridgeVersion"]),
          }
          for key, value in expected_stats.items():
              pattern = rf'<article><strong>{re.escape(value)}</strong><span data-i18n="{key}">'
              if not re.search(pattern, index):
                  raise SystemExit(f"Website statistic {key} is stale; expected {value} from bridge-contract.json")

          occt_version = str(contract["occtVersion"])
          if occt_version not in index:
              raise SystemExit(f"Website does not contain contracted OCCT version {occt_version}")

          contact = str(contract.get("contactEmail", "")).strip()
          if not contact:
              raise SystemExit("main bridge-contract.json has no contactEmail")
          if contact not in index or f"mailto:{contact}" not in index:
              raise SystemExit(f"Website contact is stale; expected {contact}")
          if "zhangly1403" + "@" + "qq.com" in content:
              raise SystemExit("Legacy contact email remains on website branch")

          print(f"Validated {len(keys)} bilingual keys against Bridge {contract['bridgeVersion']} / OCCT {occt_version}, including contact metadata.")
