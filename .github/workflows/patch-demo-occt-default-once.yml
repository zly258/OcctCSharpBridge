name: Patch demo OCCT default root

on:
  push:
    branches:
      - sync/demo-native-geometry-build-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/demo-native-geometry-build-fix
          fetch-depth: 0

      - name: Patch demo build script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('build.ps1')
          text = path.read_text(encoding='utf-8-sig')

          def replace_once(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected one target, found {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              '$Target = $Target.ToLowerInvariant()\n$RepoRoot = Split-Path -Parent $MyInvocation.MyCommand.Path\n',
              '$Target = $Target.ToLowerInvariant()\n$RepoRoot = Split-Path -Parent $MyInvocation.MyCommand.Path\n'
              '$DefaultOcctRoot = "D:\\tools\\occt-vc144-64"\n'
              'if ([string]::IsNullOrWhiteSpace($OcctRoot)) {\n'
              '    $OcctRoot = $DefaultOcctRoot\n'
              '}\n')

          replace_once(
              'function Resolve-OcctConfiguration {\n    if ([string]::IsNullOrWhiteSpace($OcctRoot)) {\n        throw "OCCT_ROOT is not configured. Pass -OcctRoot <path> or set the OCCT_ROOT environment variable."\n    }\n\n    $script:ResolvedOcctRoot = [System.IO.Path]::GetFullPath($OcctRoot)\n',
              'function Resolve-OcctConfiguration {\n'
              '    $script:ResolvedOcctRoot = [System.IO.Path]::GetFullPath($OcctRoot)\n'
              '    if (-not (Test-Path $script:ResolvedOcctRoot -PathType Container)) {\n'
              '        throw "OCCT SDK root was not found: $script:ResolvedOcctRoot. Set OCCT_ROOT, pass -OcctRoot <path>, or install OCCT at $DefaultOcctRoot. validate/managed/ci do not require OCCT."\n'
              '    }\n')

          replace_once(
              'if ([string]::IsNullOrWhiteSpace($OcctRoot)) {\n    Write-Host "OCCT root:     not configured (valid for validate/managed/ci)" -ForegroundColor DarkGray\n}\nelse {\n    Write-Host "OCCT root:     $OcctRoot" -ForegroundColor DarkGray\n}\n',
              '$occtRootSource = if ($env:OCCT_ROOT) { "environment" } elseif ($OcctRoot -eq $DefaultOcctRoot) { "default" } else { "argument" }\n'
              'Write-Host "OCCT root:     $OcctRoot ($occtRootSource)" -ForegroundColor DarkGray\n')

          path.write_text('\ufeff' + text, encoding='utf-8')
          PY

      - name: Commit and remove workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-demo-occt-default-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.ps1
          git commit -m "Add conventional OCCT default to demo build"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:sync/demo-native-geometry-build-fix
