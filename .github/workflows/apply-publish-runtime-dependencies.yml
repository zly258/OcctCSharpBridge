name: Apply Publish Runtime Dependency Closure

on:
  push:
    branches:
      - fix/publish-runtime-dependency-closure

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[publish-runtime-closure-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publish-runtime-dependency-closure
          fetch-depth: 0
      - name: Apply source patch
        shell: pwsh
        run: |
          $path = 'tools/patch-publish-runtime-dependencies.py'
          $text = [System.IO.File]::ReadAllText($path)
          $text = $text.Replace(
              'text, count = pattern.subn(replacement, text, count=1)',
              'text, count = pattern.subn(lambda match: replacement, text, count=1)')
          [System.IO.File]::WriteAllText($path, $text)
          python $path
      - name: Parse publish script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path .\publish.ps1),
              [ref]$tokens,
              [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
          }
      - name: Verify dependency-closure markers
        shell: pwsh
        run: |
          $text = Get-Content .\publish.ps1 -Raw
          foreach ($token in @('Resolve-Dumpbin','Get-PeDependencies','Resolve-RuntimeDependency','native-dependencies.txt')) {
              if (-not $text.Contains($token)) { throw "Missing token: $token" }
          }
          if ($text -match 'Copying detected third-party DLLs') {
              throw 'Old blanket third-party DLL copy still exists.'
          }
      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish.ps1 docs/PUBLISHING_DEMO.md docs/PUBLISHING_DEMO.zh-CN.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Resolve only required native publish dependencies [publish-runtime-closure-applied]"
          git push
