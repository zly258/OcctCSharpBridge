name: Website Contract

on:
  push:
    branches:
      - main
    paths:
      - bridge-contract.json
      - .github/workflows/website-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          path: main

      - name: Checkout website
        uses: actions/checkout@v6
        with:
          ref: website
          path: site
          fetch-depth: 1

      - name: Validate website against main contract
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          contract = json.loads(Path("main/bridge-contract.json").read_text(encoding="utf-8-sig"))
          index = Path("site/index.html").read_text(encoding="utf-8-sig")
          app = Path("site/app.js").read_text(encoding="utf-8-sig")
          readmes = (
              Path("site/README.md").read_text(encoding="utf-8-sig") + "\n" +
              Path("site/README.zh-CN.md").read_text(encoding="utf-8-sig")
          )

          all_text = index + "\n" + app + "\n" + readmes
          obsolete = [
              "tree/script",
              "git switch script",
              "OcctScript",
              "branchScript",
              ".NET 8",
              "net8.0-windows",
              "C# 12",
          ]
          found = [token for token in obsolete if token in all_text]
          if found:
              raise SystemExit(f"Obsolete website references found: {', '.join(found)}")
          if "Avalonia 与 Avalonia" in app:
              raise SystemExit("Duplicate Avalonia host wording found in Chinese translations.")

          expected_stats = {
              "statNative": str(contract["api"]["nativeExports"]),
              "statPInvoke": str(contract["api"]["managedPInvokes"]),
              "statTypes": str(contract["api"]["publicNetTypes"]),
              "statVersion": str(contract["bridgeVersion"]),
          }
          for key, value in expected_stats.items():
              pattern = rf'<article><strong>{re.escape(value)}</strong><span data-i18n="{key}">'
              if not re.search(pattern, index):
                  raise SystemExit(f"Website statistic {key} is stale; expected {value}")

          occt_version = str(contract["occtVersion"])
          if occt_version not in index:
              raise SystemExit("Website OCCT version is stale.")

          dotnet = contract.get("dotnet", {})
          target_framework = str(dotnet.get("targetFramework", "")).strip()
          sdk_version = str(dotnet.get("sdkVersion", "")).strip()
          language_version = str(dotnet.get("languageVersion", "")).strip()
          if not target_framework or not sdk_version or not language_version:
              raise SystemExit("Main bridge contract has incomplete .NET metadata.")
          major = target_framework.removeprefix("net").split(".", 1)[0]
          public_dotnet = f".NET {major}"
          if public_dotnet not in index or public_dotnet not in app:
              raise SystemExit(f"Website .NET version is stale; expected {public_dotnet}.")
          if target_framework not in readmes:
              raise SystemExit(f"Website target framework is stale; expected {target_framework}.")
          if sdk_version not in readmes:
              raise SystemExit(f"Website SDK version is stale; expected {sdk_version}.")
          language_pattern = rf'C#\s+(?:\*\*)?{re.escape(language_version)}(?:\*\*)?'
          if not re.search(language_pattern, readmes):
              raise SystemExit(f"Website language version is stale; expected C# {language_version}.")

          contact = str(contract.get("contactEmail", "")).strip()
          if not contact:
              raise SystemExit("Main bridge contract has no contactEmail.")
          if contact not in index or f"mailto:{contact}" not in index:
              raise SystemExit(f"Website contact is stale; expected {contact}")
          if "zhangly1403" + "@" + "qq.com" in all_text:
              raise SystemExit("Legacy contact email remains on website branch.")

          preview_names = [
              "winform-demo-en.png",
              "winform-demo-zh.png",
              "wpf-demo-en.png",
              "wpf-demo-zh.png",
              "avalonia-demo-en.png",
              "avalonia-demo-zh.png",
          ]
          for preview_name in preview_names:
              expected = f"demo/assets/previews/{preview_name}"
              if expected not in index:
                  raise SystemExit(f"Website preview reference is missing: {expected}")

          if ".webp" in index or ".webp" in app:
              raise SystemExit("Website must not reference retired WebP demo previews.")
          if "data-fallback" in index or "dataset.fallback" in app:
              raise SystemExit("Retired preview fallback wiring remains on the website.")

          print(
              f"Website branch matches Bridge {contract['bridgeVersion']} / ABI {contract['nativeAbiVersion']} / "
              f"OCCT {occt_version} / {target_framework} / SDK {sdk_version} / C# {language_version}, "
              "contact metadata, and canonical PNG preview policy."
          )
