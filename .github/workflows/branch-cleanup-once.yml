name: Branch Cleanup Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Delete absorbed branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            demo-occtdemo-naming \
            fix/demo-owner-aware-selection \
            cleanup/merged-refactor-branches
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/branch-cleanup-once.yml
          git commit -m 'Remove one-time absorbed branch cleanup workflow'
          git push origin HEAD:main
