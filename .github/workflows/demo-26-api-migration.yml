name: Demo Bridge 2.6 API Migration

on:
  push:
    branches:
      - demo
    paths:
      - .github/workflows/demo-26-api-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: demo
          fetch-depth: 0

      - name: Migrate demo source
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = [
              Path("src/CadCommon"),
              Path("src/CadWinForms"),
              Path("src/CadWpf"),
              Path("src/CadAvalonia"),
          ]
          files = [p for root in roots if root.exists() for p in root.rglob("*.cs")]

          method_replacements = {
              "Engine.GetBounds(": "Engine.GetShapeBounds(",
              "Engine.IsValid(": "Engine.IsShapeValid(",
              "Engine.GetLinearProperties(": "Engine.GetShapeLinearProperties(",
              "Engine.GetSurfaceProperties(": "Engine.GetShapeSurfaceProperties(",
              "Engine.GetVolumeProperties(": "Engine.GetShapeVolumeProperties(",
              "Engine.Distance(": "Engine.GetShapeDistance(",
              "Engine.GetSubshape(": "Engine.GetSubshapeAt(",
              "Engine.GetCurveType(": "Engine.GetEdgeCurveType(",
              "Engine.GetSurfaceType(": "Engine.GetFaceSurfaceType(",
              "Engine.GetUvBounds(": "Engine.GetFaceUvBounds(",
          }

          changed = []
          for path in files:
              original = path.read_text(encoding="utf-8-sig")
              text = original
              for old, new in method_replacements.items():
                  text = text.replace(old, new)

              # Resolve persisted IDs through the owning engine instead of fabricating handles.
              text = re.sub(
                  r"new\s+OcctObject\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*,\s*Engine\.GetObjectKind\(\s*\1\s*\)\s*\)",
                  r"Engine.GetObject(\1)",
                  text,
              )
              # Newly created typed objects are already valid IOcctObject implementations.
              text = re.sub(
                  r"new\s+OcctObject\(\s*([A-Za-z_][A-Za-z0-9_]*)\.Id\s*,\s*OcctObjectKind\.(?:Shape|Text|Dimension)\s*\)",
                  r"\1",
                  text,
              )
              # Remaining generic object type declarations become the common interface.
              text = re.sub(r"\bOcctObject\b", "IOcctObject", text)

              if text != original:
                  path.write_text("\ufeff" + text, encoding="utf-8")
                  changed.append(str(path))

          for readme in [Path("README.md"), Path("README.zh-CN.md")]:
              text = readme.read_text(encoding="utf-8-sig")
              updated = text.replace("Public .NET types: `82`", "Public .NET types: `81`")
              updated = updated.replace("Public .NET types：`82`", "Public .NET types：`81`")
              if updated != text:
                  readme.write_text("\ufeff" + updated, encoding="utf-8")
                  changed.append(str(readme))

          print("Migrated files:")
          for item in changed:
              print(f"  {item}")

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No demo migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md README.zh-CN.md
          git commit -m "Migrate demos to canonical Bridge 2.6 API"
          git push origin HEAD:demo
