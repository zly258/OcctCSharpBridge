name: Demo Naming Cleanup Once

on:
  push:
    branches:
      - refactor/demo-naming-cleanup
    paths:
      - .github/workflows/demo-naming-cleanup-once.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/demo-naming-cleanup
          fetch-depth: 0

      - name: Rename demo source layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git mv src/CadCommon src/OcctDemo.Common
          git mv src/CadWinForms src/OcctDemo.WinForms
          git mv src/CadWpf src/OcctDemo.Wpf
          git mv src/CadAvalonia src/OcctDemo.Avalonia

          git mv src/OcctDemo.Common/CadCommon.csproj src/OcctDemo.Common/OcctDemo.Common.csproj
          git mv src/OcctDemo.WinForms/CadWinForms.csproj src/OcctDemo.WinForms/OcctDemo.WinForms.csproj
          git mv src/OcctDemo.Wpf/CadWpf.csproj src/OcctDemo.Wpf/OcctDemo.Wpf.csproj
          git mv src/OcctDemo.Avalonia/CadAvalonia.csproj src/OcctDemo.Avalonia/OcctDemo.Avalonia.csproj

          git mv src/OcctDemo.Common/CadCommands.cs src/OcctDemo.Common/DemoCommands.cs
          git mv src/OcctDemo.Common/CadHistory.cs src/OcctDemo.Common/DemoHistory.cs
          git mv src/OcctDemo.Common/CadLocalization.cs src/OcctDemo.Common/DemoLocalization.cs
          git mv src/OcctDemo.Common/CadSession.cs src/OcctDemo.Common/DemoSession.cs
          git mv src/OcctDemo.Common/CadSession.Analysis.cs src/OcctDemo.Common/DemoSession.Analysis.cs
          git mv src/OcctDemo.Common/CadSession.Commands.cs src/OcctDemo.Common/DemoSession.Commands.cs
          git mv src/OcctDemo.Common/CadSession.Demos.cs src/OcctDemo.Common/DemoSession.Demos.cs
          git mv src/OcctDemo.Common/CadSession.History.cs src/OcctDemo.Common/DemoSession.History.cs
          git mv src/OcctDemo.Common/CadSession.Preconditions.cs src/OcctDemo.Common/DemoSession.Preconditions.cs

          $replacements = [ordered]@{
            'CadParameterDefinition' = 'DemoParameterDefinition'
            'CadCommandDefinition' = 'DemoCommandDefinition'
            'CadDepthBiasPreset' = 'DemoDepthBiasPreset'
            'CadCommandCatalog' = 'DemoCommandCatalog'
            'CadCommandResult' = 'DemoCommandResult'
            'CadHistoryEntry' = 'DemoHistoryEntry'
            'CadLocalization' = 'DemoLocalization'
            'CadParameterKind' = 'DemoParameterKind'
            'CadCommandId' = 'DemoCommandId'
            'CadLanguage' = 'DemoLanguage'
            'CadValues' = 'DemoValues'
            'CadIsoView' = 'DemoIsoView'
            'CadSession' = 'DemoSession'
            'CadAvalonia' = 'OcctDemo.Avalonia'
            'CadWinForms' = 'OcctDemo.WinForms'
            'CadCommon' = 'OcctDemo.Common'
            'CadWpf' = 'OcctDemo.Wpf'
          }

          $roots = @(
            'src/OcctDemo.Common',
            'src/OcctDemo.WinForms',
            'src/OcctDemo.Wpf',
            'src/OcctDemo.Avalonia'
          )
          $files = @()
          foreach ($root in $roots) {
            $files += Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @('.cs','.csproj','.xaml','.resx','.manifest','.md') }
          }
          foreach ($relative in @('OcctBridge.sln','build.ps1','run.ps1','publish.ps1','README.md','README.zh-CN.md','.github/workflows/demo-build.yml')) {
            if (Test-Path $relative -PathType Leaf) { $files += Get-Item $relative }
          }

          $utf8Bom = [System.Text.UTF8Encoding]::new($true)
          foreach ($file in $files | Sort-Object FullName -Unique) {
            $text = [System.IO.File]::ReadAllText($file.FullName)
            $updated = $text
            foreach ($pair in $replacements.GetEnumerator()) {
              $updated = $updated.Replace([string]$pair.Key, [string]$pair.Value)
            }
            if ($updated -ne $text) {
              [System.IO.File]::WriteAllText($file.FullName, $updated, $utf8Bom)
            }
          }

          foreach ($project in @(
            'src/OcctDemo.Common/OcctDemo.Common.csproj',
            'src/OcctDemo.WinForms/OcctDemo.WinForms.csproj',
            'src/OcctDemo.Wpf/OcctDemo.Wpf.csproj',
            'src/OcctDemo.Avalonia/OcctDemo.Avalonia.csproj'
          )) {
            $text = [System.IO.File]::ReadAllText($project)
            if ($text -notmatch '<IsPackable>false</IsPackable>') {
              $text = $text -replace '(<TargetFramework>[^<]+</TargetFramework>)', '$1`r`n    <IsPackable>false</IsPackable>'
              [System.IO.File]::WriteAllText($project, $text, $utf8Bom)
            }
          }

          @'
          # OcctDemo.Common

          `OcctDemo.Common` is demo-only application support code used by the WinForms, WPF and Avalonia sample programs.

          It intentionally is **not** a reusable CAD framework and is not part of the `main` Bridge SDK. It contains only the small orchestration layer needed by the demos: command metadata, parameter parsing, localization, replay-based demo history, analysis helpers and the demo session facade.

          Product-level document models, feature trees, tools, snapping, grips, persistence and domain entities belong in consuming CAD/BIM applications rather than `OcctCSharpBridge`.
          '@ | Set-Content src/OcctDemo.Common/README.md -Encoding utf8BOM

          git add -A
          git commit -m 'Use explicit OcctDemo naming for demo application layer'
          git push origin HEAD:refactor/demo-naming-cleanup

      - name: Validate renamed demo
        shell: pwsh
        run: |
          git pull --ff-only
          .\build.ps1 validate Release
          .\build.ps1 managed Release
          $legacy = git grep -n -E '\bCad(Common|WinForms|Wpf|Avalonia|CommandId|ParameterKind|ParameterDefinition|CommandDefinition|CommandResult|CommandCatalog|HistoryEntry|Language|Localization|Values|IsoView|DepthBiasPreset|Session)\b' -- src OcctBridge.sln build.ps1 run.ps1 publish.ps1 README.md README.zh-CN.md .github/workflows/demo-build.yml 2>$null
          if ($LASTEXITCODE -eq 0 -and $legacy) {
            Write-Host $legacy
            throw 'Legacy Cad-prefixed demo source naming remains.'
          }
          if ($LASTEXITCODE -notin @(0,1)) { throw 'git grep failed.' }

      - name: Remove one-time workflow
        if: success()
        shell: pwsh
        run: |
          git pull --ff-only
          git rm .github/workflows/demo-naming-cleanup-once.yml
          git commit -m 'Remove one-time demo naming cleanup workflow'
          git push origin HEAD:refactor/demo-naming-cleanup
