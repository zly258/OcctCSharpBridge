name: Apply Analytic Geometry API 2.4

on:
  push:
    branches:
      - feature/analytic-geometry-api-2.4

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply analytic geometry integration
        shell: pwsh
        run: python .\.github\apply_analytic_geometry_2_4.py

      - name: Validate reusable wrapper
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Build managed projects
        shell: pwsh
        run: |
          dotnet build .\src\OcctNet\OcctNet.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'OcctNet build failed.' }
          dotnet build .\src\OcctNet.WinForms\OcctNet.WinForms.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'OcctNet.WinForms build failed.' }
          dotnet build .\src\OcctNet.Wpf\OcctNet.Wpf.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'OcctNet.Wpf build failed.' }
          dotnet build .\tests\OcctNet.Smoke\OcctNet.Smoke.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Smoke project build failed.' }

      - name: Check patch quality
        shell: pwsh
        run: git diff --check

      - name: Commit integrated API
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows
          git add -A
          if (git diff --cached --quiet) { throw 'No analytic geometry changes were produced.' }
          git commit -m "Add analytic geometry query APIs"
          git push origin HEAD:feature/analytic-geometry-api-2.4
