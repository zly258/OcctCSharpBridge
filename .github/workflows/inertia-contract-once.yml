name: Inertia Contract Once

on:
  push:
    branches:
      - feat/modeling-inertia-properties

permissions:
  contents: write

jobs:
  update-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/modeling-inertia-properties
          fetch-depth: 0

      - name: Update contract and API coverage counts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          contract_path = Path('bridge-contract.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8-sig'))
          contract['api']['nativeExports'] = 354
          contract['api']['managedPInvokes'] = 354
          contract['api']['publicNetTypes'] = 100
          contract['api']['modeling'] = 140
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8-sig')

          for name in ('docs/API_COVERAGE.md', 'docs/API_COVERAGE.zh-CN.md'):
              path = Path(name)
              text = path.read_text(encoding='utf-8-sig')
              text = text.replace('Native exports: `351`', 'Native exports: `354`')
              text = text.replace('Managed P/Invoke declarations: `351`', 'Managed P/Invoke declarations: `354`')
              text = text.replace('Public .NET types: `99`', 'Public .NET types: `100`')
              text = text.replace('Modeling API: `137`', 'Modeling API: `140`')
              if name.endswith('API_COVERAGE.md'):
                  marker = '- linear/surface/volume mass properties and shape distance;'
                  replacement = '- linear/surface/volume mass properties, inertia tensor/principal properties, and shape distance;'
                  text = text.replace(marker, replacement)
                  text = text.replace('extending the additive C surface to 351 exported symbols', 'extending the additive C surface to 354 exported symbols')
              else:
                  marker = '- 线/面/体质量属性与 Shape Distance；'
                  replacement = '- 线/面/体质量属性、惯性张量/主惯性属性与 Shape Distance；'
                  text = text.replace(marker, replacement)
                  text = text.replace('扩展到 351 个 C Export', '扩展到 354 个 C Export')
              path.write_text(text, encoding='utf-8-sig')
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inertia-contract-once.yml
          git add bridge-contract.json docs/API_COVERAGE.md docs/API_COVERAGE.zh-CN.md
          git commit -m "Update inertia API contract"
          git push origin HEAD:feat/modeling-inertia-properties
