name: Branch Cleanup Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Delete absorbed .NET 10 work branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for branch in \
            'refactor/net10-contract-cleanup' \
            'refactor/net10-contract-finalize' \
            'refactor/net10-contract-final' \
            'fix/demo-net10-runtime-contract'
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/branch-cleanup-once.yml
          git commit -m 'Remove one-time .NET 10 branch cleanup workflow'
          git push origin HEAD:main
