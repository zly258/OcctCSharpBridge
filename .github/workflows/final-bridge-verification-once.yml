name: Final Bridge Verification Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-bridge-verification-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Checkout demo
        uses: actions/checkout@v6
        with:
          ref: demo
          path: demo
          fetch-depth: 1

      - name: Checkout website
        uses: actions/checkout@v6
        with:
          ref: website
          path: website
          fetch-depth: 1

      - name: Compare reusable main/demo bridge source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $fixedPaths = @(
            '.editorconfig', '.gitattributes', 'global.json', 'bridge-contract.json', 'Directory.Build.props',
            'src/OcctNative',
            'docs/INDEX.md', 'docs/INDEX.zh-CN.md',
            'docs/ARCHITECTURE_BOUNDARIES.md', 'docs/ARCHITECTURE_BOUNDARIES.zh-CN.md',
            'docs/API_COVERAGE.md', 'docs/API_COVERAGE.zh-CN.md',
            'docs/SELECTION_HITS.md', 'docs/SELECTION_HITS.zh-CN.md',
            'docs/GEOMETRY_UTILITIES.md', 'docs/GEOMETRY_UTILITIES.zh-CN.md',
            'docs/BSPLINE_CURVES.md', 'docs/BSPLINE_CURVES.zh-CN.md',
            'docs/TOPOLOGY_ANALYSIS.md', 'docs/TOPOLOGY_ANALYSIS.zh-CN.md',
            'docs/SHAPE_INSPECTION.md', 'docs/SHAPE_INSPECTION.zh-CN.md',
            'docs/MESH_PROVENANCE.md', 'docs/MESH_PROVENANCE.zh-CN.md',
            'docs/RUNTIME_DIAGNOSTICS.md', 'docs/RUNTIME_DIAGNOSTICS.zh-CN.md',
            'tests/README.md', 'tests/ContractTestHelpers.psm1',
            'tests/OcctNet.ManagedTests', 'tests/OcctNet.Smoke',
            'tests/check-api-organization.ps1', 'tests/check-api-surface.ps1',
            'tests/check-geometry-api.ps1', 'tests/check-topology-analysis.ps1',
            'tests/check-runtime-diagnostics.ps1', 'tests/check-native-build-structure.ps1',
            'tests/check-selection-contract.ps1', 'tests/check-ui-hosts.ps1',
            'tests/check-version-contract.ps1', 'tests/check-viewport-api.ps1'
          )

          foreach ($path in $fixedPaths) {
            & git diff --no-index --exit-code -- "main/$path" "demo/$path"
            if ($LASTEXITCODE -ne 0) { throw "Shared bridge path differs: $path" }
          }

          foreach ($directory in @('src/OcctNet','src/OcctNet.WinForms','src/OcctNet.Wpf','src/OcctNet.Avalonia')) {
            $mainRoot = (Resolve-Path "main/$directory").Path
            $demoRoot = (Resolve-Path "demo/$directory").Path
            $mainFiles = @(Get-ChildItem $mainRoot -Filter '*.cs' -File -Recurse | ForEach-Object { $_.FullName.Substring($mainRoot.Length + 1).Replace('\','/') } | Sort-Object)
            $demoFiles = @(Get-ChildItem $demoRoot -Filter '*.cs' -File -Recurse | ForEach-Object { $_.FullName.Substring($demoRoot.Length + 1).Replace('\','/') } | Sort-Object)
            if (Compare-Object $mainFiles $demoFiles) { throw "Shared C# file set differs: $directory" }
            foreach ($file in $mainFiles) {
              & git diff --no-index --exit-code -- (Join-Path $mainRoot $file) (Join-Path $demoRoot $file)
              if ($LASTEXITCODE -ne 0) { throw "Shared C# source differs: $directory/$file" }
            }
          }

      - name: Validate main managed SDK
        shell: pwsh
        working-directory: main
        run: .\build.ps1 ci Release

      - name: Validate demo managed applications
        shell: pwsh
        working-directory: demo
        run: .\build.ps1 ci Release

      - name: Validate website visible contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $contract = Get-Content 'main/bridge-contract.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $index = [System.IO.File]::ReadAllText((Resolve-Path 'website/index.html'))
          $app = [System.IO.File]::ReadAllText((Resolve-Path 'website/app.js'))
          $files = @(Get-ChildItem website -Recurse -File | Where-Object { $_.Extension -in @('.html','.htm','.md','.js','.json','.txt') })
          $all = ($files | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName) }) -join "`n"

          $expectedStats = @{
            statNative = [string]$contract.api.nativeExports
            statPInvoke = [string]$contract.api.managedPInvokes
            statTypes = [string]$contract.api.publicNetTypes
            statVersion = [string]$contract.bridgeVersion
          }
          foreach ($entry in $expectedStats.GetEnumerator()) {
            $pattern = '<article><strong>' + [regex]::Escape($entry.Value) + '</strong><span data-i18n="' + [regex]::Escape($entry.Key) + '">'
            if ($index -notmatch $pattern) { throw "Website statistic $($entry.Key) is stale; expected $($entry.Value)." }
          }

          if ($index -notmatch [regex]::Escape([string]$contract.occtVersion)) {
            throw "Website OCCT version is stale; expected $($contract.occtVersion)."
          }
          if ($app.Contains('Avalonia 与 Avalonia')) {
            throw 'Website contains duplicate Avalonia host wording.'
          }
          if ($all -match '\b8\.0\.423\b') {
            throw 'Website still contains the obsolete repository build SDK 8.0.423.'
          }
          if ($all.Contains('tree/script') -or $all.Contains('git switch script') -or $all.Contains('OcctScript')) {
            throw 'Website still contains retired script branch references.'
          }

      - name: Validate final repository hygiene
        shell: pwsh
        working-directory: main
        run: |
          $ErrorActionPreference = 'Stop'
          $branches = @(git ls-remote --heads origin | ForEach-Object { if ($_ -match 'refs/heads/(.+)$') { $Matches[1] } } | Sort-Object)
          $unexpected = @($branches | Where-Object { $_ -notin @('main','demo','website') })
          if ($unexpected.Count -gt 0) { throw "Unexpected branches remain: $($unexpected -join ', ')" }

          foreach ($branch in @('demo','website')) {
            $workflowListing = git ls-tree -r --name-only "origin/$branch" -- '.github/workflows'
            $oneTime = @($workflowListing | Where-Object { $_ -match '(?:once|cleanup-once|baseline-once)\.ya?ml$' })
            if ($oneTime.Count -gt 0) { throw "One-time workflows remain on ${branch}: $($oneTime -join ', ')" }
          }

      - name: Remove final verification workflow
        shell: pwsh
        working-directory: main
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/workflows/final-bridge-verification-once.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove final bridge verification workflow'
          git push origin HEAD:main
