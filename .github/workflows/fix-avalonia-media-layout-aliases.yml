name: Fix Avalonia Media Layout Aliases

on:
  push:
    branches:
      - feature/avalonia-wpf-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary Avalonia media layout alias workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/avalonia-wpf-parity
          fetch-depth: 0
      - name: Patch aliases
        shell: python
        run: |
          from pathlib import Path

          main = Path('src/CadAvalonia/MainWindow.cs')
          text = main.read_text(encoding='utf-8-sig')
          anchor = 'using DrawingColor = System.Drawing.Color;\n'
          aliases = '''using AvaloniaBrushes = Avalonia.Media.Brushes;
          using AvaloniaColor = Avalonia.Media.Color;
          using AvaloniaFontFamily = Avalonia.Media.FontFamily;
          using AvaloniaHorizontalAlignment = Avalonia.Layout.HorizontalAlignment;
          using AvaloniaOrientation = Avalonia.Layout.Orientation;
          using AvaloniaToolTip = Avalonia.Controls.ToolTip;
          '''
          if aliases.strip() not in text:
              text = text.replace(anchor, anchor + aliases)
          text = text.replace('Color.Parse(', 'AvaloniaColor.Parse(')
          text = text.replace('new FontFamily(', 'new AvaloniaFontFamily(')
          text = text.replace('Orientation = Orientation.', 'Orientation = AvaloniaOrientation.')
          text = text.replace('HorizontalAlignment = HorizontalAlignment.', 'HorizontalAlignment = AvaloniaHorizontalAlignment.')
          text = text.replace('Brushes.', 'AvaloniaBrushes.')
          text = text.replace('ToolTip.SetTip(', 'AvaloniaToolTip.SetTip(')
          main.write_text(text, encoding='utf-8-sig')

          parameter = Path('src/CadAvalonia/ParameterDialog.cs')
          text = parameter.read_text(encoding='utf-8-sig')
          anchor = 'using CadCommon;\n'
          aliases = '''using AvaloniaHorizontalAlignment = Avalonia.Layout.HorizontalAlignment;
          using AvaloniaOrientation = Avalonia.Layout.Orientation;
          '''
          if aliases.strip() not in text:
              text = text.replace(anchor, anchor + aliases)
          text = text.replace('Orientation = Orientation.', 'Orientation = AvaloniaOrientation.')
          text = text.replace('HorizontalAlignment = HorizontalAlignment.', 'HorizontalAlignment = AvaloniaHorizontalAlignment.')
          parameter.write_text(text, encoding='utf-8-sig')
      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/fix-avalonia-media-layout-aliases.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "zly258"
          git config user.email "zhangly1403@qq.com"
          git add -A
          git commit -m "Disambiguate Avalonia media and layout types"
          git push origin HEAD:feature/avalonia-wpf-parity
