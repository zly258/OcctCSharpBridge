name: Apply Demo Command Preconditions

on:
  push:
    branches:
      - fix/demo-command-preconditions

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Run demo command precondition migration')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply command preconditions
        shell: pwsh
        run: python .\.github\apply_demo_command_preconditions.py

      - name: Validate demo contracts
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Build demo projects
        shell: pwsh
        run: |
          dotnet build .\src\CadCommon\CadCommon.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'CadCommon build failed.' }
          dotnet build .\src\CadWinForms\CadWinForms.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'WinForms demo build failed.' }
          dotnet build .\src\CadWpf\CadWpf.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'WPF demo build failed.' }

      - name: Check patch quality
        shell: pwsh
        run: git diff --check

      - name: Commit precondition changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows
          git add -A
          if (git diff --cached --quiet) { throw 'No demo precondition changes were produced.' }
          git commit -m "Add early command selection preconditions"
          git push origin HEAD:fix/demo-command-preconditions
