name: API Surface

on:
  push:
    branches:
      - main
      - agent/**
      - optimize/**
      - feature/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-surface-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8.0.423
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.423

      - name: Run reusable bridge CI build
        shell: pwsh
        run: .\build.ps1 ci Release
