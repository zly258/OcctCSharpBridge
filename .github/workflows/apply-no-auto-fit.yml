name: Apply No Auto Fit

on:
  push:
    branches:
      - agent/docs-publish-runtime

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[no-auto-fit-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-publish-runtime
          fetch-depth: 0
      - name: Apply source patch
        run: python tools/patch-no-auto-fit.py
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/OcctNative/OcctEngine.cpp
          git commit -m "Keep camera unchanged when creating shapes [no-auto-fit-applied]"
          git push
