name: Publish Script Check

on:
  push:
    branches:
      - demo
      - optimize/**
      - sync/**
  pull_request:
    branches:
      - demo

jobs:
  validate-publish-script:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse package scripts
        shell: pwsh
        run: |
          foreach ($path in @(
              '.\publish.ps1',
              '.\tests\check-demo-package.ps1'
          )) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $path),
                  [ref]$tokens,
                  [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $errors | Format-List
                  throw "PowerShell parse failed: $path"
              }
          }

      - name: Verify publishing inputs
        shell: pwsh
        run: |
          $required = @(
              '.\publish.ps1',
              '.\build.ps1',
              '.\tests\check-demo-package.ps1',
              '.\tests\check-native-build-structure.ps1',
              '.\tests\check-selection-contract.ps1',
              '.\tests\check-viewport-api.ps1',
              '.\tests\check-ui-hosts.ps1',
              '.\tests\check-analytic-geometry-api.ps1',
              '.\src\OcctNet.WinForms\OcctNet.WinForms.csproj',
              '.\src\OcctNet.Wpf\OcctNet.Wpf.csproj',
              '.\src\CadWinForms\CadWinForms.csproj',
              '.\src\CadWpf\CadWpf.csproj'
          )
          foreach ($path in $required) {
              if (-not (Test-Path $path -PathType Leaf)) {
                  throw "Required publishing input was not found: $path"
              }
          }

      - name: Verify modular project references
        shell: pwsh
        run: |
          $winForms = Get-Content '.\src\CadWinForms\CadWinForms.csproj' -Raw
          if (-not $winForms.Contains('..\OcctNet.WinForms\OcctNet.WinForms.csproj')) {
              throw 'The WinForms demo does not reference OcctNet.WinForms.'
          }

          $wpf = Get-Content '.\src\CadWpf\CadWpf.csproj' -Raw
          if (-not $wpf.Contains('..\OcctNet.Wpf\OcctNet.Wpf.csproj')) {
              throw 'The WPF demo does not reference OcctNet.Wpf.'
          }
          if ($wpf.Contains('..\OcctNet.WinForms\OcctNet.WinForms.csproj')) {
              throw 'The WPF demo must use the dedicated WPF host instead of referencing the WinForms host directly.'
          }

          $xaml = Get-Content '.\src\CadWpf\MainWindow.xaml' -Raw
          if (-not $xaml.Contains('assembly=OcctNet.Wpf') -or
              -not $xaml.Contains('<occt:OcctWpfViewport')) {
              throw 'The WPF demo does not use OcctWpfViewport.'
          }
          if ($xaml.Contains('WindowsFormsHost')) {
              throw 'The WPF application still constructs WindowsFormsHost directly.'
          }

      - name: Validate deployment-complete package contract
        shell: pwsh
        run: .\tests\check-demo-package.ps1 -RepositoryRoot $PWD
