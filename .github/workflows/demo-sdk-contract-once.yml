name: Demo SDK Contract Once

on:
  push:
    branches:
      - demo
    paths:
      - .github/workflows/demo-sdk-contract-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout demo
        uses: actions/checkout@v6
        with:
          ref: demo
          fetch-depth: 0

      - name: Align branch-specific build script and validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $buildPath = 'build.ps1'
          $buildText = [System.IO.File]::ReadAllText($buildPath)
          if ($buildText.Contains('demoSdkVersion')) {
            $buildText = $buildText.Replace('demoSdkVersion', 'sdkVersion')
            [System.IO.File]::WriteAllText($buildPath, $buildText, [System.Text.UTF8Encoding]::new($true))
          }

          .\build.ps1 validate Release

          Remove-Item '.github/workflows/demo-sdk-contract-once.yml' -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align demo build with unified SDK contract'
          git push origin HEAD:demo
