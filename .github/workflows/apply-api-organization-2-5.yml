name: Apply API Organization 2.5

on:
  push:
    branches:
      - feature/api-organization-2.5

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Repair migration anchors
        shell: pwsh
        run: python .\.github\fix_api_organization_2_5.py

      - name: Apply API organization migration
        shell: pwsh
        run: python .\.github\apply_api_organization_2_5.py

      - name: Repair generated validation scripts
        shell: pwsh
        run: python .\.github\postfix_api_organization_2_5.py

      - name: Validate wrapper contracts
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Build managed wrapper and hosts
        shell: pwsh
        run: |
          dotnet build .\src\OcctNet\OcctNet.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'OcctNet build failed.' }
          dotnet build .\src\OcctNet.WinForms\OcctNet.WinForms.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'OcctNet.WinForms build failed.' }
          dotnet build .\src\OcctNet.Wpf\OcctNet.Wpf.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'OcctNet.Wpf build failed.' }
          dotnet build .\tests\OcctNet.Smoke\OcctNet.Smoke.csproj -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Smoke project build failed.' }

      - name: Check patch quality
        shell: pwsh
        run: git diff --check

      - name: Commit API 2.5 migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows
          git add -A
          if (git diff --cached --quiet) { throw 'No API organization changes were produced.' }
          git commit -m "Organize modeling API and add differential geometry queries"
          git push origin HEAD:feature/api-organization-2.5
