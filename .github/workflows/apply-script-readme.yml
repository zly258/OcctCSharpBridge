name: Apply Script README

on:
  push:
    branches:
      - update/script-readme

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/script-readme
          fetch-depth: 0
      - run: python3 apply_script_readme_patch.py
      - run: rm apply_script_readme_patch.py .github/workflows/apply-script-readme.yml
      - run: |
          git config user.name zly258
          git config user.email zhangly1403@qq.com
          git add -A
          git commit -m "Expand OcctScript setup documentation"
          git push origin HEAD:update/script-readme
