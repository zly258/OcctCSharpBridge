name: Apply Demo Publish Patch

on:
  push:
    branches:
      - agent/demo-publish-docs

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[demo-publish-patch-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/demo-publish-docs
          fetch-depth: 0
      - name: Apply source patch
        run: python tools/patch-demo-publish.py
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path .\publish.ps1),
              [ref]$tokens,
              [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
          }
      - name: Commit patched sources
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish.ps1 src/CadCommon/CadSession.cs
          git commit -m "Preserve Demo camera and validate publish script [demo-publish-patch-applied]"
          git push
