name: Repository Cleanup Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Delete verified temporary branches
        shell: bash
        run: |
          set -euo pipefail

          temporary_branches=(
            "cleanup/merged-refactor-branches"
            "fix/demo-owner-aware-selection"
            "refactor/bridge-architecture-cleanup"
            "refactor/demo-cad-session-cleanup"
            "sync/website-bridge-architecture"
          )

          for branch in "${temporary_branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting verified temporary branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

          mapfile -t remaining < <(git ls-remote --heads origin | sed -E 's#.*refs/heads/##' | sort)
          printf 'Remaining branches: %s\n' "${remaining[*]}"

          for branch in "${remaining[@]}"; do
            case "$branch" in
              main|demo|website) ;;
              *) echo "Unexpected branch remains: $branch" >&2; exit 1 ;;
            esac
          done

      - name: Remove completed cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repository-cleanup-once.yml
          git commit -m "Remove completed repository cleanup workflow"
          git push origin HEAD:main
