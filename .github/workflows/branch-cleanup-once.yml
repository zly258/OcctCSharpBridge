name: Remove cleanup branch once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Delete only this cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          branch="cleanup/merged-refactor-branches"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Deleting completed cleanup branch: $branch"
            git push origin --delete "$branch"
          else
            echo "Already absent: $branch"
          fi

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/branch-cleanup-once.yml
          git commit -m "Remove completed cleanup workflow"
          git push origin HEAD:main
