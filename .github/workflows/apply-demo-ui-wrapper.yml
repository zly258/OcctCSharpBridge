name: Apply Demo UI and Wrapper Enhancements

on:
  push:
    branches:
      - optimize/demo-startup-publish
    paths:
      - tools/apply-demo-ui-wrapper.py
      - .github/workflows/apply-demo-ui-wrapper.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: optimize/demo-startup-publish
          fetch-depth: 0

      - name: Apply patch
        shell: pwsh
        run: python .\tools\apply-demo-ui-wrapper.py

      - name: Remove one-shot helpers and commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .\tools\apply-demo-ui-wrapper.py
          git rm .\.github\workflows\apply-demo-ui-wrapper.yml
          git add -A
          git commit -m "Improve selection, appearance, lighting, and demo UI"
          git push origin HEAD:optimize/demo-startup-publish
