name: API Surface

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-surface-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate main SDK packaging contract
        shell: pwsh
        run: .\tests\check-sdk-package.ps1

      - name: Run reusable bridge CI build
        shell: pwsh
        run: .\build.ps1 ci Release
