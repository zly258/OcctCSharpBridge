name: Apply Demo View Update

on:
  push:
    branches:
      - update/demo-view-docs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/demo-view-docs
          fetch-depth: 0
      - name: Patch demo display settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8-sig')

          replace_once(
              'src/CadCommon/CadLocalization.cs',
              '["Menu.Shaded"] = "Shaded",\n            ["Menu.Wireframe"] = "2D Wireframe",',
              '["Menu.Shaded"] = "Shaded",\n            ["Menu.ShadedEdges"] = "Shaded with Edges",\n            ["Menu.Wireframe"] = "2D Wireframe",')
          replace_once(
              'src/CadCommon/CadLocalization.cs',
              '["Menu.FitAll"] = "缩放至范围", ["Menu.FitSelected"] = "缩放至选中对象", ["Menu.Shaded"] = "着色", ["Menu.Wireframe"] = "二维线框",',
              '["Menu.FitAll"] = "缩放至范围", ["Menu.FitSelected"] = "缩放至选中对象", ["Menu.Shaded"] = "着色", ["Menu.ShadedEdges"] = "着色并显示边线", ["Menu.Wireframe"] = "二维线框",')

          replace_once(
              'src/CadWinForms/MainForm.cs',
              'display.DropDownItems.Add(MenuItem(CadLocalization.Text("Menu.Shaded"), (_, _) => Session.Engine.SetDisplayMode(OcctDisplayMode.Shaded)));\n        display.DropDownItems.Add(MenuItem(CadLocalization.Text("Menu.Wireframe"), (_, _) => Session.Engine.SetDisplayMode(OcctDisplayMode.Wireframe)));',
              'display.DropDownItems.Add(MenuItem(CadLocalization.Text("Menu.Shaded"), (_, _) => Session.Engine.SetDisplayMode(OcctDisplayMode.Shaded)));\n        display.DropDownItems.Add(CheckMenuItem(CadLocalization.Text("Menu.ShadedEdges"), true, (_, item) => ExecuteSafe(() => Session.Engine.SetFaceBoundariesVisible(item.Checked))));\n        display.DropDownItems.Add(MenuItem(CadLocalization.Text("Menu.Wireframe"), (_, _) => Session.Engine.SetDisplayMode(OcctDisplayMode.Wireframe)));')
          replace_once(
              'src/CadWinForms/MainForm.Startup.cs',
              '            applyExisting: true);\n        _depthDefaultsApplied = true;',
              '            applyExisting: true);\n        _session.Engine.SetFaceBoundariesVisible(true, applyExisting: true);\n        _depthDefaultsApplied = true;')

          replace_once(
              'src/CadWpf/MainWindow.xaml.cs',
              '            _session.Engine.SetAntialiasing(true);\n            _session.Engine.SetAutoZFitMode(true, 1.0);',
              '            _session.Engine.SetAntialiasing(true);\n            _session.Engine.SetFaceBoundariesVisible(true, applyExisting: true);\n            _session.Engine.SetAutoZFitMode(true, 1.0);')
          replace_once(
              'src/CadWpf/MainWindow.xaml.cs',
              'display.Items.Add(MenuItem(CadLocalization.Text("Menu.Shaded"), (_, _) => Session.Engine.SetDisplayMode(OcctDisplayMode.Shaded)));\n        display.Items.Add(MenuItem(CadLocalization.Text("Menu.Wireframe"), (_, _) => Session.Engine.SetDisplayMode(OcctDisplayMode.Wireframe)));',
              'display.Items.Add(MenuItem(CadLocalization.Text("Menu.Shaded"), (_, _) => Session.Engine.SetDisplayMode(OcctDisplayMode.Shaded)));\n        display.Items.Add(CheckMenuItem(CadLocalization.Text("Menu.ShadedEdges"), true, item => ExecuteSafe(() => Session.Engine.SetFaceBoundariesVisible(item.IsChecked))));\n        display.Items.Add(MenuItem(CadLocalization.Text("Menu.Wireframe"), (_, _) => Session.Engine.SetDisplayMode(OcctDisplayMode.Wireframe)));')

          replace_once(
              'src/CadAvalonia/MainWindow.cs',
              '            engine.SetAntialiasing(true);\n\n            var box = engine.MakeBox',
              '            engine.SetAntialiasing(true);\n            engine.SetFaceBoundariesVisible(true, applyExisting: true);\n\n            var box = engine.MakeBox')

          # Keep the regression check close to the existing UI-host contract.
          p = Path('tests/check-ui-hosts.ps1')
          text = p.read_text(encoding='utf-8-sig')
          marker = 'Write-Host "[ui-hosts]'
          if 'Menu.ShadedEdges' not in text:
              insert = '''\n$demoFiles = @(\n    (Join-Path $RepositoryRoot "src\\CadWinForms\\MainForm.cs"),\n    (Join-Path $RepositoryRoot "src\\CadWpf\\MainWindow.xaml.cs")\n)\nforeach ($demoFile in $demoFiles) {\n    $demoText = [System.IO.File]::ReadAllText($demoFile)\n    foreach ($token in @('Menu.ShadedEdges', 'SetFaceBoundariesVisible')) {\n        if (-not $demoText.Contains($token)) {\n            throw "Demo shaded-edge display contract is missing '$token' in $demoFile"\n        }\n    }\n}\n\n'''
              if marker in text:
                  text = text.replace(marker, insert + marker, 1)
              else:
                  text += insert
              p.write_text(text, encoding='utf-8-sig')
          PY
      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/apply-demo-view-docs.yml
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "zly258"
          git config user.email "zhangly1403@qq.com"
          git add -A
          git commit -m "Unify shaded edge display across demos"
          git push origin HEAD:update/demo-view-docs
