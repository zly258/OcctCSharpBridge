name: Fix Avalonia Parity Aliases

on:
  push:
    branches:
      - feature/avalonia-wpf-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary Avalonia parity alias fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/avalonia-wpf-parity
          fetch-depth: 0
      - name: Patch aliases
        shell: python
        run: |
          from pathlib import Path

          main = Path('src/CadAvalonia/MainWindow.cs')
          text = main.read_text(encoding='utf-8-sig')
          marker = 'using Forms = System.Windows.Forms;\n'
          aliases = '''using Button = Avalonia.Controls.Button;
          using ComboBox = Avalonia.Controls.ComboBox;
          using Control = Avalonia.Controls.Control;
          using GroupBox = Avalonia.Controls.GroupBox;
          using TextBox = Avalonia.Controls.TextBox;
          using TreeView = Avalonia.Controls.TreeView;
          using KeyEventArgs = Avalonia.Input.KeyEventArgs;
          '''
          if aliases.strip() not in text:
              text = text.replace(marker, marker + aliases)
          text = text.replace('Forms.SystemSounds.Asterisk.Play();', 'System.Media.SystemSounds.Asterisk.Play();')
          main.write_text(text, encoding='utf-8-sig')

          parameter = Path('src/CadAvalonia/ParameterDialog.cs')
          text = parameter.read_text(encoding='utf-8-sig')
          marker = 'using CadCommon;\n'
          alias = 'using Control = Avalonia.Controls.Control;\n'
          if alias not in text:
              text = text.replace(marker, marker + alias)
          parameter.write_text(text, encoding='utf-8-sig')
      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/fix-avalonia-parity-aliases.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "zly258"
          git config user.email "zhangly1403@qq.com"
          git add -A
          git commit -m "Disambiguate Avalonia UI types from WinForms dialogs"
          git push origin HEAD:feature/avalonia-wpf-parity
