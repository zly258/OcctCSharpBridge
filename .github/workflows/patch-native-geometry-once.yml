name: Native geometry patch once

on:
  push:
    branches:
      - refactor/split-native-modeling-geometry

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/split-native-modeling-geometry
          fetch-depth: 0

      - name: Apply exact repository edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text('\ufeff' + text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}')
              write(path, text.replace(old, new, 1))

          replace_once(
              'src/OcctNative/CMakeLists.txt',
              '    OcctModelingGeometry.cpp\n',
              '    OcctModelingGeometry.Curves.cpp\n'
              '    OcctModelingGeometry.Planar.cpp\n'
              '    OcctModelingGeometry.Primitives.cpp\n'
              '    OcctModelingGeometry.Assembly.cpp\n'
              '    OcctModelingGeometry.Transform.cpp\n')

          replace_once(
              'src/OcctNative/CMakeLists.txt',
              'set(OCCT_ROOT "$ENV{OCCT_ROOT}" CACHE PATH "OCCT installation root")\nif(NOT OCCT_ROOT)\n    message(FATAL_ERROR "OCCT_ROOT is not configured. Pass -DOCCT_ROOT=<path> or set the OCCT_ROOT environment variable.")\nendif()\n',
              'set(OCCT_DEFAULT_ROOT "D:/tools/occt-vc144-64" CACHE PATH "Default OCCT installation root used when OCCT_ROOT is not supplied")\n'
              'set(OCCT_ROOT "$ENV{OCCT_ROOT}" CACHE PATH "OCCT installation root")\n'
              'if(NOT OCCT_ROOT AND OCCT_DEFAULT_ROOT)\n'
              '    set(OCCT_ROOT "${OCCT_DEFAULT_ROOT}" CACHE PATH "OCCT installation root" FORCE)\n'
              'endif()\n'
              'if(NOT OCCT_ROOT OR NOT EXISTS "${OCCT_ROOT}")\n'
              '    message(FATAL_ERROR "OCCT SDK root was not found: ${OCCT_ROOT}. Set OCCT_ROOT, pass -DOCCT_ROOT=<path>, or install OCCT at ${OCCT_DEFAULT_ROOT}.")\n'
              'endif()\n')

          replace_once(
              'src/OcctNative/CMakeLists.txt',
              '    TKService TKV3d TKOpenGl TKXSBase TKDE TKDESTEP TKDEIGES TKDESTL\n    TKSTEPBase TKSTEPAttr TKSTEP209 TKSTEP TKIGES)',
              '    TKService TKV3d TKOpenGl TKXSBase TKDE TKDESTEP TKDEIGES TKDESTL)')

          replace_once(
              'build.ps1',
              '$Target = $Target.ToLowerInvariant()\n$RepoRoot = Split-Path -Parent $MyInvocation.MyCommand.Path\n',
              '$Target = $Target.ToLowerInvariant()\n$RepoRoot = Split-Path -Parent $MyInvocation.MyCommand.Path\n'
              '$DefaultOcctRoot = "D:\\tools\\occt-vc144-64"\n'
              'if ([string]::IsNullOrWhiteSpace($OcctRoot)) {\n'
              '    $OcctRoot = $DefaultOcctRoot\n'
              '}\n')

          replace_once(
              'build.ps1',
              'function Resolve-OcctConfiguration {\n    if ([string]::IsNullOrWhiteSpace($OcctRoot)) {\n        throw "OCCT_ROOT is not configured. Pass -OcctRoot <path> or set the OCCT_ROOT environment variable."\n    }\n\n    $script:OcctRoot = [System.IO.Path]::GetFullPath($OcctRoot)\n',
              'function Resolve-OcctConfiguration {\n'
              '    $script:OcctRoot = [System.IO.Path]::GetFullPath($OcctRoot)\n'
              '    if (-not (Test-Path $script:OcctRoot -PathType Container)) {\n'
              '        throw "OCCT SDK root was not found: $script:OcctRoot. Set OCCT_ROOT, pass -OcctRoot <path>, or install OCCT at $DefaultOcctRoot. validate/managed/pack/ci do not require OCCT."\n'
              '    }\n')

          replace_once(
              'build.ps1',
              'if ([string]::IsNullOrWhiteSpace($OcctRoot)) {\n    Write-Host "OCCT root:     not configured (valid for validate/managed/pack/ci)" -ForegroundColor DarkGray\n}\nelse {\n    Write-Host "OCCT root:     $OcctRoot" -ForegroundColor DarkGray\n}\n',
              '$occtRootSource = if ($env:OCCT_ROOT) { "environment" } elseif ($OcctRoot -eq $DefaultOcctRoot) { "default" } else { "argument" }\n'
              'Write-Host "OCCT root:     $OcctRoot ($occtRootSource)" -ForegroundColor DarkGray\n')

          test_path = 'tests/check-native-build-structure.ps1'
          text = read(test_path)
          marker = '$modules = @(\n'
          if text.count(marker) != 1:
              raise SystemExit('native structure test marker mismatch')

          insertion = '''$geometryModules = @(\n    @{ File = "OcctModelingGeometry.Curves.cpp"; Symbols = @("occt_model_make_vertex", "occt_model_make_line", "occt_model_make_circle", "occt_model_make_bspline_interpolated") },\n    @{ File = "OcctModelingGeometry.Planar.cpp"; Symbols = @("occt_model_make_regular_polygon", "occt_model_make_rectangle_wire", "occt_model_make_plane_face", "occt_model_make_face_from_wire") },\n    @{ File = "OcctModelingGeometry.Primitives.cpp"; Symbols = @("occt_model_make_box", "occt_model_make_cylinder", "occt_model_make_sphere", "occt_model_make_torus") },\n    @{ File = "OcctModelingGeometry.Assembly.cpp"; Symbols = @("occt_model_make_compound", "occt_model_make_wire", "occt_model_make_solid_from_shell") },\n    @{ File = "OcctModelingGeometry.Transform.cpp"; Symbols = @("occt_model_translate", "occt_model_rotate", "occt_model_scale", "occt_model_mirror_plane") }\n)\nforeach ($module in $geometryModules) {\n    if ($module.File -notin $sourceTokens) { throw "Split native modeling geometry module is not listed in add_library: $($module.File)" }\n    $moduleText = [System.IO.File]::ReadAllText((Join-Path $nativeRoot $module.File))\n    if ($moduleText.Contains('#include "OcctModelingInternal.hxx"')) { throw "$($module.File) depends on the broad modeling compatibility umbrella." }\n    foreach ($symbol in $module.Symbols) {\n        if (-not $moduleText.Contains($symbol)) { throw "Split native modeling geometry module $($module.File) is missing expected responsibility symbol: $symbol" }\n    }\n}\nif ("OcctModelingGeometry.cpp" -in $sourceTokens -or (Test-Path (Join-Path $nativeRoot "OcctModelingGeometry.cpp"))) {\n    throw "Legacy OcctModelingGeometry.cpp must remain removed after the five-way native geometry split."\n}\n\nforeach ($legacyToolkit in @("TKSTEPBase", "TKSTEPAttr", "TKSTEP209", "TKSTEP", "TKIGES")) {\n    if ($text.Contains($legacyToolkit)) { throw "Legacy pre-7.9 data-exchange toolkit remains in native CMake dependencies: $legacyToolkit" }\n}\nforeach ($requiredToolkit in @("TKDESTEP", "TKDEIGES", "TKDESTL")) {\n    if (-not $text.Contains($requiredToolkit)) { throw "Required OCCT 7.9 data-exchange toolkit is missing from native CMake dependencies: $requiredToolkit" }\n}\n\n$buildScriptText = [System.IO.File]::ReadAllText((Join-Path $RepositoryRoot "build.ps1"))\nif (-not $buildScriptText.Contains('D:\\tools\\occt-vc144-64')) { throw "build.ps1 must provide the conventional OCCT default root." }\nif (-not $buildScriptText.Contains('validate/managed/pack/ci do not require OCCT')) { throw "build.ps1 must preserve OCCT-optional managed/validation targets." }\n\n'''
          text = text.replace(marker, insertion + marker, 1)
          text = text.replace(
              '$($modelingInternalHeaders.Count) modeling internal layers, and $($modules.Count) dedicated modeling modules validated;',
              '$($modelingInternalHeaders.Count) modeling internal layers, $($geometryModules.Count) split modeling geometry modules, and $($modules.Count) dedicated modeling modules validated;',
              1)
          write(test_path, text)
          PY

      - name: Commit repository edits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-native-geometry-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.ps1 src/OcctNative/CMakeLists.txt tests/check-native-build-structure.ps1
          git commit -m "Fix OCCT 7.9 build dependencies and geometry layout"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refactor/split-native-modeling-geometry
