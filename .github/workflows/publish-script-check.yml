name: Publish Script Check

on:
  push:
    branches:
      - demo
      - optimize/**
  pull_request:
    branches:
      - demo

jobs:
  validate-publish-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse publish.ps1
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path .\publish.ps1),
              [ref]$tokens,
              [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
          }

      - name: Verify publishing inputs
        shell: pwsh
        run: |
          $required = @(
              '.\publish.ps1',
              '.\build.ps1',
              '.\src\CadWinForms\CadWinForms.csproj',
              '.\src\CadWpf\CadWpf.csproj'
          )
          foreach ($path in $required) {
              if (-not (Test-Path $path -PathType Leaf)) {
                  throw "Required publishing input was not found: $path"
              }
          }

      - name: Verify lean package rules
        shell: pwsh
        run: |
          $text = Get-Content .\publish.ps1 -Raw
          foreach ($token in @(
              'PublishSingleFile=true',
              'EnableCompressionInSingleFile=$($SelfContained.IsPresent.ToString().ToLowerInvariant())',
              '[switch]$SelfContained',
              '[switch]$FullResources',
              '[switch]$Diagnostics',
              'native-dependencies.txt',
              'THIRD-PARTY-NOTICES.txt'
          )) {
              if (-not $text.Contains($token)) {
                  throw "Lean publishing token was not found: $token"
              }
          }

          if ($text -match '\[string\]\$Target\s*=\s*"all"') {
              throw 'The default package target must not publish both UI demos.'
          }
          if ($text -match 'PublishSingleFile=false') {
              throw 'Managed demo output is not configured as single-file.'
          }
          if ($text -match 'EnableCompressionInSingleFile=true') {
              throw 'Framework-dependent publishing must not force single-file compression.'
          }
          if ($text -match 'function\s+Write-Launcher') {
              throw 'Legacy launcher generation is still present.'
          }
