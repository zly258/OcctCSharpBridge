name: Refresh Demo ViewCube Inventory

on:
  push:
    branches:
      - feature/demo-usability-localization

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh demo ViewCube API inventory'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh inventory
        shell: pwsh
        run: |
          foreach ($path in @('docs/API_COVERAGE.md', 'docs/API_COVERAGE.zh-CN.md')) {
            $text = [System.IO.File]::ReadAllText($path)
            $text = $text.Replace('Native exports: `327`', 'Native exports: `328`')
            $text = $text.Replace('Managed P/Invoke declarations: `327`', 'Managed P/Invoke declarations: `328`')
            $text = $text.Replace('Public .NET types: `75`', 'Public .NET types: `76`')
            $text = $text.Replace('OcctNative.h — Viewer and interaction (78)', 'OcctNative.h — Viewer and interaction (79)')
            $text = $text.Replace('- `occt_set_view_cube_visible`', "- `occt_set_view_cube_visible`n- `occt_set_view_cube_language`")
            $text = $text.Replace('- `OcctViewOrientation`', "- `OcctViewCubeLanguage`n- `OcctViewOrientation`")
            [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($true))
          }
          $versionContract = 'tests/check-version-contract.ps1'
          $versionText = [System.IO.File]::ReadAllText($versionContract)
          $versionText = $versionText.Replace('$expectedNativeCount = 327', '$expectedNativeCount = 328')
          $versionText = $versionText.Replace('$expectedPublicTypeCount = 75', '$expectedPublicTypeCount = 76')
          [System.IO.File]::WriteAllText($versionContract, $versionText, [System.Text.UTF8Encoding]::new($true))
          Remove-Item .github/workflows/refresh-demo-viewcube-inventory.yml

      - name: Validate
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh API inventory for ViewCube localization"
          git push origin HEAD:feature/demo-usability-localization
