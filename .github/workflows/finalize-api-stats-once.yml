name: Finalize Website API Statistics Once

on:
  push:
    branches:
      - website
    paths:
      - .github/workflows/finalize-api-stats-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: website
          fetch-depth: 1

      - name: Normalize statistics and remove temporary workflows
        shell: pwsh
        run: |
          $path = 'index.html'
          $text = [System.IO.File]::ReadAllText($path)
          $text = [regex]::Replace($text, '<article><strong>\d+</strong><span data-i18n="statNative">Native C ABI</span></article>', '<article><strong>344</strong><span data-i18n="statNative">Native C ABI</span></article>')
          $text = [regex]::Replace($text, '<article><strong>\d+</strong><span data-i18n="statPInvoke">P/Invoke mappings</span></article>', '<article><strong>344</strong><span data-i18n="statPInvoke">P/Invoke mappings</span></article>')
          $text = [regex]::Replace($text, '<article><strong>\d+</strong><span data-i18n="statTypes">Public \.NET types</span></article>', '<article><strong>86</strong><span data-i18n="statTypes">Public .NET types</span></article>')
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($true))

          foreach ($temp in @(
              '.github/workflows/update-api-stats-once.yml',
              '.github/workflows/update-api-stats-surface-once.yml',
              '.github/workflows/finalize-api-stats-once.yml'
          )) {
              if (Test-Path $temp) { Remove-Item $temp -Force }
          }

      - name: Commit final statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "Finalize website API statistics"
            git push origin HEAD:website
          fi
