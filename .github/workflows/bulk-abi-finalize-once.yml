name: Bulk ABI Finalize Once

on:
  push:
    branches:
      - perf/modeling-bulk-abi

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'Run one-time bulk ABI contract finalization')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: perf/modeling-bulk-abi
          fetch-depth: 0

      - name: Finalize bulk ABI contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8-sig', newline='\n')

          header_path = 'src/OcctNative/OcctModeling.h'
          header = read(header_path)
          replacements = [
              (
                  '    OCCTBRIDGE_API int occt_model_ray_hit_at(OcctModelHandle handle, int index, OcctModelRayHit* result);\n'
                  '    OCCTBRIDGE_API int occt_model_classify_point',
                  '    OCCTBRIDGE_API int occt_model_ray_hit_at(OcctModelHandle handle, int index, OcctModelRayHit* result);\n'
                  '    OCCTBRIDGE_API int occt_model_ray_hits_copy(OcctModelHandle handle, OcctModelRayHit* results, int capacity);\n'
                  '    OCCTBRIDGE_API int occt_model_classify_point'
              ),
              (
                  '    OCCTBRIDGE_API OcctObjectId occt_model_history_generated_at(OcctModelHandle handle, OcctOperationId operationId, OcctObjectId sourceShapeId, int index);\n'
                  '    OCCTBRIDGE_API int occt_model_history_modified_count',
                  '    OCCTBRIDGE_API OcctObjectId occt_model_history_generated_at(OcctModelHandle handle, OcctOperationId operationId, OcctObjectId sourceShapeId, int index);\n'
                  '    OCCTBRIDGE_API int occt_model_history_generated_copy(OcctModelHandle handle, OcctOperationId operationId, OcctObjectId sourceShapeId, OcctObjectId* results, int capacity);\n'
                  '    OCCTBRIDGE_API int occt_model_history_modified_count'
              ),
              (
                  '    OCCTBRIDGE_API OcctObjectId occt_model_history_modified_at(OcctModelHandle handle, OcctOperationId operationId, OcctObjectId sourceShapeId, int index);\n'
                  '    OCCTBRIDGE_API int occt_model_history_is_removed',
                  '    OCCTBRIDGE_API OcctObjectId occt_model_history_modified_at(OcctModelHandle handle, OcctOperationId operationId, OcctObjectId sourceShapeId, int index);\n'
                  '    OCCTBRIDGE_API int occt_model_history_modified_copy(OcctModelHandle handle, OcctOperationId operationId, OcctObjectId sourceShapeId, OcctObjectId* results, int capacity);\n'
                  '    OCCTBRIDGE_API int occt_model_history_is_removed'
              ),
          ]
          for old, new in replacements:
              if old not in header:
                  raise SystemExit(f'Expected native declaration block not found: {old[:80]}')
              header = header.replace(old, new, 1)
          write(header_path, header)

          contract_path = Path('bridge-contract.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8-sig'))
          contract['api']['nativeExports'] = 351
          contract['api']['managedPInvokes'] = 351
          contract['api']['modeling'] = 137
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8-sig')

          for path in ('docs/API_COVERAGE.md', 'docs/API_COVERAGE.zh-CN.md'):
              text = read(path)
              for old, new in (
                  ('Native exports: `348`', 'Native exports: `351`'),
                  ('Managed P/Invoke declarations: `348`', 'Managed P/Invoke declarations: `351`'),
                  ('Modeling API: `134`', 'Modeling API: `137`'),
              ):
                  if old not in text:
                      raise SystemExit(f'{path} is missing expected API-count text: {old}')
                  text = text.replace(old, new, 1)
              if path.endswith('API_COVERAGE.md'):
                  marker = 'Algorithms cover Fuse/Cut/Common/Section/Splitter, Extrude/Revolve/Sweep/Loft, Fillet/Chamfer, 3D offset, planar wire offset, thick solid, same-domain unification, healing, and operation history.\n'
                  addition = marker + '\nRay-hit retrieval and generated/modified topology history use bulk-copy Native ABI calls; legacy indexed `...At` exports remain available for ABI compatibility but are not used by the managed collection APIs.\n'
              else:
                  marker = '算法覆盖 Fuse/Cut/Common/Section/Splitter、Extrude/Revolve/Sweep/Loft、Fillet/Chamfer、3D Offset、平面 Wire Offset、Thick Solid、同域合并、修复和操作历史。\n'
                  addition = marker + '\n射线命中结果以及 Generated/Modified 拓扑历史均通过批量复制 Native ABI 获取；旧的索引式 `...At` 导出继续保留用于 ABI 兼容，但托管集合接口不再逐项调用。\n'
              if marker in text and 'bulk-copy Native ABI' not in text and '批量复制 Native ABI' not in text:
                  text = text.replace(marker, addition, 1)
              write(path, text)

          native_test_path = 'tests/check-native-build-structure.ps1'
          native_test = read(native_test_path)
          old = '@{ File = "OcctModelingHistory.cpp"; Symbols = @("occt_model_history_generated_count", "occt_model_history_modified_at", "occt_model_history_is_removed") }'
          new = '@{ File = "OcctModelingHistory.cpp"; Symbols = @("occt_model_history_generated_count", "occt_model_history_generated_copy", "occt_model_history_modified_copy", "occt_model_history_is_removed") }'
          if old not in native_test:
              raise SystemExit('History native-structure contract token not found')
          native_test = native_test.replace(old, new, 1)
          old = '@{ File = "OcctModelingAnalysis.cpp"; Symbols = @("occt_model_project_point_on_edge", "occt_model_ray_intersections", "occt_model_classify_point") }'
          new = '@{ File = "OcctModelingAnalysis.cpp"; Symbols = @("occt_model_project_point_on_edge", "occt_model_ray_intersections", "occt_model_ray_hits_copy", "occt_model_classify_point") }'
          if old not in native_test:
              raise SystemExit('Analysis native-structure contract token not found')
          native_test = native_test.replace(old, new, 1)
          write(native_test_path, native_test)

          org_path = 'tests/check-api-organization.ps1'
          org = read(org_path)
          marker = 'Write-Host "[organization] Bridge 2.6 canonical naming, strict ownership, typed DTO boundaries and responsibility layout validated." -ForegroundColor Green'
          if marker not in org:
              raise SystemExit('Organization test final marker not found')
          block = r'''
# High-cardinality modeling collections must use bulk ABI transfer. Indexed exports remain
# compatibility primitives only and must not be used by the managed collection methods.
$analysisSessionText = [System.IO.File]::ReadAllText((Join-Path $RepositoryRoot "src\OcctNet\OcctModelingSession.Analysis.cs"))
foreach ($token in @("occt_model_ray_hits_copy", "NativeModelRayHit[count]")) {
    if (-not $analysisSessionText.Contains($token)) { throw "Managed ray intersection bulk contract is missing: $token" }
}
if ($analysisSessionText.Contains("occt_model_ray_hit_at(_handle")) {
    throw "Managed IntersectRay must not use N+1 indexed ray-hit P/Invoke calls."
}

$historySessionText = [System.IO.File]::ReadAllText((Join-Path $RepositoryRoot "src\OcctNet\OcctModelingSession.History.cs"))
foreach ($token in @("occt_model_history_generated_copy", "occt_model_history_modified_copy", "GetHistoryShapes")) {
    if (-not $historySessionText.Contains($token)) { throw "Managed topology-history bulk contract is missing: $token" }
}
if ($historySessionText.Contains("occt_model_history_generated_at(_handle") -or $historySessionText.Contains("occt_model_history_modified_at(_handle")) {
    throw "Managed topology-history collections must not use N+1 indexed P/Invoke calls."
}

$historyNativeText = [System.IO.File]::ReadAllText((Join-Path $RepositoryRoot "src\OcctNative\OcctModelingAlgorithmInternal.hxx"))
if (-not $historyNativeText.Contains("historyCopy")) { throw "Linear native topology-history bulk helper is missing." }

'''
          if 'High-cardinality modeling collections must use bulk ABI transfer.' not in org:
              org = org.replace(marker, block + marker, 1)
          write(org_path, org)
          PY

      - name: Commit finalized bulk ABI contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bulk-abi-finalize-once.yml
          git add src/OcctNative/OcctModeling.h bridge-contract.json docs/API_COVERAGE.md docs/API_COVERAGE.zh-CN.md tests/check-native-build-structure.ps1 tests/check-api-organization.ps1
          git commit -m "Finalize bulk modeling ABI contract"
          git push origin HEAD:perf/modeling-bulk-abi
