name: Apply OCAF XDE Removal

on:
  push:
    branches:
      - optimize/remove-ocaf-xde

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Relax migration self-check
        shell: pwsh
        run: |
          $path = '.\.github\apply_remove_ocaf_xde.py'
          $text = Get-Content $path -Raw
          $text = $text.Replace('for root_name in ("src", "tests"):', 'for root_name in ("src",):')
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, [System.Text.UTF8Encoding]::new($true))

      - name: Remove OCAF and XDE bridge layers
        shell: pwsh
        run: python .\.github\apply_remove_ocaf_xde.py

      - name: Validate API surface
        shell: pwsh
        run: .\tests\check-api-surface.ps1 -RepositoryRoot $PWD

      - name: Build reusable core wrapper
        shell: pwsh
        run: dotnet build .\src\OcctNet\OcctNet.csproj -c Release -p:Platform=x64 --nologo

      - name: Build optional WinForms host
        shell: pwsh
        run: dotnet build .\src\OcctNet.WinForms\OcctNet.WinForms.csproj -c Release -p:Platform=x64 --nologo

      - name: Compile modeling smoke tests
        shell: pwsh
        run: dotnet build .\tests\OcctNet.Smoke\OcctNet.Smoke.csproj -c Release -p:Platform=x64 --nologo

      - name: Validate removal and patch quality
        shell: pwsh
        run: |
          if (Test-Path .\src\OcctNative\OcctOcaf.h) { throw 'OcctOcaf.h still exists.' }
          if (Test-Path .\src\OcctNet\OcafDocument.cs) { throw 'OcafDocument.cs still exists.' }
          $cmake = Get-Content .\src\OcctNative\CMakeLists.txt -Raw
          foreach ($token in @('OcctOcaf', 'TKXCAF', 'ocaf_required_libraries')) {
            if ($cmake.Contains($token)) { throw "CMake still contains: $token" }
          }
          git diff --check

      - name: Commit optimized bridge
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw 'No migration changes were produced.' }
          git commit -m "Remove OCAF and XDE from the reusable bridge"
          git push origin HEAD:optimize/remove-ocaf-xde
