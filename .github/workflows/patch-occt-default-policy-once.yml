name: OCCT default path policy patch once

on:
  push:
    branches:
      - refactor/split-native-modeling-geometry

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/split-native-modeling-geometry
          fetch-depth: 0

      - name: Patch allowed default path locations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/check-version-contract.ps1')
          text = path.read_text(encoding='utf-8-sig')
          old = """        if (-not $path.EndsWith('build.ps1', [System.StringComparison]::OrdinalIgnoreCase)) {
            throw \"The conventional OCCT default path may only appear in build.ps1; found in $path.\"
        }
"""
          new = """        $isBuildScript = $path.EndsWith('build.ps1', [System.StringComparison]::OrdinalIgnoreCase)
        $isNativeCMake = $path.EndsWith('src\\OcctNative\\CMakeLists.txt', [System.StringComparison]::OrdinalIgnoreCase)
        if (-not ($isBuildScript -or $isNativeCMake)) {
            throw \"The conventional OCCT default path may only appear in build.ps1 or native CMakeLists.txt; found in $path.\"
        }
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one default-path location block, found {text.count(old)}')
          path.write_text('\ufeff' + text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and remove workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-occt-default-policy-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/check-version-contract.ps1
          git commit -m "Scope conventional OCCT default path policy"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refactor/split-native-modeling-geometry
