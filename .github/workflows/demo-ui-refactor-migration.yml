name: Demo UI Refactor Migration

on:
  push:
    branches: [demo]
    paths:
      - .github/workflows/demo-ui-refactor-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: demo
      - name: Normalize WinForms and Avalonia workspace layout
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8-sig')

          path = 'src/CadWinForms/MainForm.Designer.cs'
          text = read(path)
          text = text.replace('    private SplitContainer _rightSplitContainer = null!;\n', '')
          text = text.replace('        _rightSplitContainer = new SplitContainer();\n', '')
          text = text.replace('        ((ISupportInitialize)_rightSplitContainer).BeginInit();\n        _rightSplitContainer.Panel1.SuspendLayout();\n        _rightSplitContainer.Panel2.SuspendLayout();\n        _rightSplitContainer.SuspendLayout();\n', '')
          text = text.replace(
              '        _rootLayout.Controls.Add(_mainSplitContainer, 0, 2);\n        _rootLayout.Controls.Add(_statusBar, 0, 3);',
              '        _rootLayout.Controls.Add(_mainSplitContainer, 0, 2);\n        _rootLayout.Controls.Add(_logGroup, 0, 3);\n        _rootLayout.Controls.Add(_statusBar, 0, 4);')
          text = text.replace('        _rootLayout.RowCount = 4;', '        _rootLayout.RowCount = 5;')
          text = text.replace(
              '        _rootLayout.RowStyles.Add(new RowStyle(SizeType.Percent, 100F));\n        _rootLayout.RowStyles.Add(new RowStyle(SizeType.AutoSize));',
              '        _rootLayout.RowStyles.Add(new RowStyle(SizeType.Percent, 100F));\n        _rootLayout.RowStyles.Add(new RowStyle(SizeType.Absolute, 160F));\n        _rootLayout.RowStyles.Add(new RowStyle(SizeType.AutoSize));')
          text = text.replace(
              '        _centerRightSplitContainer.Panel2.Controls.Add(_rightSplitContainer);',
              '        _centerRightSplitContainer.Panel2.Controls.Add(_propertyGroup);')

          pattern = re.compile(
              r'        //\n        // _rightSplitContainer\n        //\n.*?(?=        //\n        // _propertyGroup\n        //)',
              re.S)
          text, count = pattern.subn('', text)
          if count != 1:
              raise RuntimeError(f'Expected one WinForms right splitter block, found {count}')

          text = text.replace('        _propertyGroup.Size = new Size(330, 498);', '        _propertyGroup.Size = new Size(330, 809);')
          text = text.replace('        _logGroup.Location = new Point(0, 2);', '        _logGroup.Location = new Point(4, 0);')
          text = text.replace('        _logGroup.Margin = new Padding(0);', '        _logGroup.Margin = new Padding(4, 0, 4, 4);')
          text = text.replace('        _logGroup.MinimumSize = new Size(280, 160);', '        _logGroup.MinimumSize = new Size(0, 120);')
          text = text.replace('        _logGroup.Size = new Size(330, 305);', '        _logGroup.Size = new Size(1432, 156);')
          text = text.replace('        _logBox.BackColor = Color.FromArgb(16, 24, 32);', '        _logBox.BackColor = SystemColors.Window;')
          text = text.replace('        _logBox.ForeColor = Color.FromArgb(216, 226, 234);', '        _logBox.ForeColor = SystemColors.WindowText;')
          text = text.replace('        _logBox.Size = new Size(314, 274);', '        _logBox.Size = new Size(1416, 125);')
          text = text.replace('        _logBox.WordWrap = false;', '        _logBox.WordWrap = false;\n        _logBox.BorderStyle = BorderStyle.FixedSingle;')
          text = text.replace(
              '        _centerRightSplitContainer.ResumeLayout(false);\n        _rightSplitContainer.Panel1.ResumeLayout(false);\n        _rightSplitContainer.Panel2.ResumeLayout(false);\n        ((ISupportInitialize)_rightSplitContainer).EndInit();\n        _rightSplitContainer.ResumeLayout(false);',
              '        _centerRightSplitContainer.ResumeLayout(false);')
          write(path, text)

          path = 'src/CadAvalonia/MainWindow.cs'
          text = read(path)
          text = text.replace('Background = new SolidColorBrush(AvaloniaColor.Parse("#101820")),', 'Background = AvaloniaBrushes.White,')
          text = text.replace('Foreground = new SolidColorBrush(AvaloniaColor.Parse("#D8E2EA")),', 'Foreground = new SolidColorBrush(AvaloniaColor.Parse("#20262C")),')
          text = text.replace('BorderBrush = new SolidColorBrush(AvaloniaColor.Parse("#48525B"))', 'BorderBrush = new SolidColorBrush(AvaloniaColor.Parse("#CBD1D6"))')
          write(path, text)
          '@ | Set-Content -Path migrate_layout.py -Encoding utf8
          python migrate_layout.py
          Remove-Item migrate_layout.py
      - name: Commit layout refactor
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CadWinForms src/CadAvalonia
          git commit -m "Move demo command logs to bottom"
          git push origin HEAD:demo
