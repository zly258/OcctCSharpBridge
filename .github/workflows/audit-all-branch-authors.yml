name: All Branch Author Audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit every branch
        shell: bash
        run: |
          cat > /tmp/audit_authors.py <<'PY'
          from pathlib import Path
          import re
          import subprocess

          branches = ['main', 'demo', 'script', 'website', 'agent/avalonia-host']
          old_chinese = ''.join(chr(v) for v in (0x5F20, 0x71CE, 0x539F))
          canonical = 'Liaoyuan Zhang'
          legacy_western = re.compile(r'\bZhang\s*,?\s+Liaoyuan\b', re.IGNORECASE)
          reverse_noncanonical = re.compile(r'\bLiaoyuan\s+Zhang\b', re.IGNORECASE)
          bad = []
          canonical_hits = []

          for branch in branches:
              ref = f'origin/{branch}'
              files = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', ref], text=True, encoding='utf-8').splitlines()
              for path in files:
                  try:
                      raw = subprocess.check_output(['git', 'show', f'{ref}:{path}'])
                      text = raw.decode('utf-8-sig')
                  except (UnicodeDecodeError, subprocess.CalledProcessError):
                      continue
                  for number, line in enumerate(text.splitlines(), 1):
                      if old_chinese in line or legacy_western.search(line):
                          bad.append((branch, path, number, 'legacy-name'))
                      if reverse_noncanonical.search(line) and canonical not in line:
                          bad.append((branch, path, number, 'noncanonical-case-or-spacing'))
                      if canonical in line:
                          canonical_hits.append((branch, path, number))

          print('Canonical references:')
          for branch, path, number in canonical_hits:
              print(f'  {branch}: {path}:{number}')

          if bad:
              print('Non-canonical author references:')
              for branch, path, number, reason in bad:
                  print(f'  {branch}: {path}:{number} [{reason}]')
              raise SystemExit(1)

          print('All branch author audit passed.')
          PY
          python /tmp/audit_authors.py
