name: API Surface

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate native and managed declarations
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Build managed wrapper
        shell: pwsh
        run: dotnet build .\src\OcctNet\OcctNet.csproj -c Release -p:Platform=x64 --nologo
