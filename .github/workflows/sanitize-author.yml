name: Sanitize author display

on:
  push:
    branches: [demo]

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo
          fetch-depth: 0
      - name: Replace Chinese author display
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              ("张燎原 / Zhang Liaoyuan", "Zhang Liaoyuan"),
              ("张燎原（zhangly1403）", "Zhang Liaoyuan (zhangly1403)"),
              ("张燎原 (zhangly1403)", "Zhang Liaoyuan (zhangly1403)"),
              ("张燎原", "Zhang Liaoyuan"),
          ]
          text_suffixes = {".cs", ".xaml", ".xml", ".md", ".txt", ".json", ".yml", ".yaml", ".ps1", ".props", ".targets", ".sln", ".csproj", ".html", ".js", ".css"}
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {"LICENSE"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8-sig")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8-sig")
          workflow = Path(".github/workflows/sanitize-author.yml")
          if workflow.exists():
              workflow.unlink()
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Use English-only author name"
            git push origin HEAD:demo
          fi
