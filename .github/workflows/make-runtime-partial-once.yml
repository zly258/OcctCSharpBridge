name: Make Runtime Partial Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/make-runtime-partial-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Make OcctRuntime partial and remove migration workflow
        shell: pwsh
        run: |
          $path = 'src/OcctNet/OcctRuntime.cs'
          $text = [System.IO.File]::ReadAllText($path)
          if ($text.Contains('public static partial class OcctRuntime')) {
              # already done
          }
          elseif ($text.Contains('public static class OcctRuntime')) {
              $text = $text.Replace('public static class OcctRuntime', 'public static partial class OcctRuntime')
          }
          else {
              throw 'OcctRuntime class declaration was not found.'
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($true))
          Remove-Item '.github/workflows/make-runtime-partial-once.yml'

      - name: Commit runtime partial declaration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/OcctNet/OcctRuntime.cs .github/workflows/make-runtime-partial-once.yml
          git commit -m "Allow structured runtime diagnostics extension"
          git push origin HEAD:main
