name: Apply Headless Primitive Build Fix

on:
  push:
    branches:
      - fix/headless-primitive-build

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[headless-primitives-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/headless-primitive-build
          fetch-depth: 0
      - name: Apply native primitive patch
        run: python tools/patch-headless-primitives.py
      - name: Verify managed projects
        shell: pwsh
        run: |
          dotnet build .\src\OcctNet\OcctNet.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\tests\OcctNet.Smoke\OcctNet.Smoke.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/OcctNative/OcctModelingGeometry.cpp
          git commit -m "Build headless primitives before completion checks [headless-primitives-applied]"
          git push
