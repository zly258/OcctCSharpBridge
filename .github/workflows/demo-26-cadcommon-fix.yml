name: Demo Bridge 2.6 CadCommon Fix

on:
  push:
    branches:
      - demo
    paths:
      - .github/workflows/demo-26-cadcommon-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: demo
          fetch-depth: 0

      - name: Finalize CadCommon API migration
        shell: python
        run: |
          from pathlib import Path

          changes = {
              Path("src/CadCommon/CadSession.cs"): [
                  ("var shape = new OcctShape(value.Id);", "var shape = Engine.GetShape(value.Id);"),
                  (".Select(item => new OcctShape(item.Id))", ".Select(item => Engine.GetShape(item.Id))"),
                  ("Engine.Shapes.Select(Engine.GetBounds).ToArray()", "Engine.Shapes.Select(Engine.GetShapeBounds).ToArray()"),
              ],
              Path("src/CadCommon/CadSession.Preconditions.cs"): [
                  (".Select(value => new OcctShape(value.Id))", ".Select(value => Engine.GetShape(value.Id))"),
              ],
          }

          for path, replacements in changes.items():
              text = path.read_text(encoding="utf-8-sig")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected CadCommon token not found in {path}: {old}")
                  text = text.replace(old, new)
              path.write_text("\ufeff" + text, encoding="utf-8")

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CadCommon
          git commit -m "Finalize CadCommon Bridge 2.6 API migration"
          git push origin HEAD:demo
