name: Update Avalonia Parity Documentation

on:
  push:
    branches:
      - feature/avalonia-wpf-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary Avalonia parity documentation workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/avalonia-wpf-parity
          fetch-depth: 0
      - name: Update documentation
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              for old, new in replacements:
                  if old not in text:
                      raise RuntimeError(f'missing documentation anchor in {path}: {old[:80]}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8-sig')

          patch('README.md', [
              (
                  'Avalonia currently provides a lightweight host-validation demo covering a real OCCT scene, point/rectangle selection, rotation, pan, zoom, Z-up views, DPI synchronization, and native-window lifetime. The full CAD command UI remains in the WinForms and WPF demos.',
                  'Avalonia now uses the same shared `CadSession` and `CadCommandCatalog` application layer as WPF. Its CAD demo includes the complete command menus, parameter input, undo/redo, file exchange, model explorer, properties, command log, view/display controls, selection tools, analysis commands, samples, shortcuts, and bilingual UI while retaining the native Avalonia `NativeControlHost` viewport.'
              ),
              (
                  'WinForms and WPF start in shaded mode with face edges enabled. Use **View → Visual Styles → Shaded with Edges** to toggle face-boundary drawing independently from Shaded/Wireframe. The lightweight Avalonia demo also enables face boundaries by default.',
                  'WinForms, WPF, and Avalonia start in shaded mode with face edges enabled. Use **View → Visual Styles → Shaded with Edges** to toggle face-boundary drawing independently from Shaded/Wireframe.'
              ),
              (
                  'The existing `publish.ps1` continues to produce deployment-complete WinForms and WPF packages. Avalonia is currently included in build, run, and CI as a host-validation demo but has not yet been added to the formal publishing flow.',
                  'The existing `publish.ps1` continues to produce deployment-complete WinForms and WPF packages. Avalonia is now a full CAD demo in build, run, and CI; adding it to the formal publishing flow remains a separate packaging task.'
              )
          ])

          patch('README.zh-CN.md', [
              (
                  'Avalonia 当前提供轻量的宿主验证 Demo，用于验证真实 OCCT 场景、点选/框选、旋转、平移、缩放、Z-up 视图、DPI 与原生窗口生命周期。完整 CAD 命令界面仍以 WinForms/WPF Demo 为主。',
                  'Avalonia 现已与 WPF 共用 `CadSession` 和 `CadCommandCatalog` 应用层，完整提供命令菜单、参数输入、撤销重做、文件交换、模型树、属性面板、命令日志、视图与显示控制、选择工具、分析命令、示例、快捷键和中英文界面，同时继续使用 Avalonia 原生 `NativeControlHost` 承载 OCCT 视口。'
              ),
              (
                  'WinForms 与 WPF 默认使用着色并显示实体边线，可在 **视图 → 视觉样式 → 着色并显示边线** 独立开关面边界显示；它不会改变 Shaded/Wireframe 本身。轻量 Avalonia Demo 也默认开启面边界。',
                  'WinForms、WPF 与 Avalonia 默认都使用着色并显示实体边线，可在 **视图 → 视觉样式 → 着色并显示边线** 独立开关面边界显示；它不会改变 Shaded/Wireframe 本身。'
              ),
              (
                  '现有 `publish.ps1` 继续负责 WinForms 和 WPF 的部署完整发布包。Avalonia 当前作为宿主验证 Demo 纳入构建、运行和 CI，但尚未加入正式发布包流程。',
                  '现有 `publish.ps1` 继续负责 WinForms 和 WPF 的部署完整发布包。Avalonia 已作为完整 CAD Demo 纳入构建、运行和 CI；是否加入正式发布包流程作为独立的打包任务处理。'
              )
          ])

          loc = Path('src/CadCommon/CadLocalization.cs')
          text = loc.read_text(encoding='utf-8-sig')
          text = text.replace('WinForms / WPF native viewport bridge', 'WinForms / WPF / Avalonia native viewport bridge')
          text = text.replace('WinForms / WPF 原生视口桥接', 'WinForms / WPF / Avalonia 原生视口桥接')
          loc.write_text(text, encoding='utf-8-sig')
      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/update-avalonia-parity-docs.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "zly258"
          git config user.email "zhangly1403@qq.com"
          git add -A
          git commit -m "Document full Avalonia CAD demo parity"
          git push origin HEAD:feature/avalonia-wpf-parity
