name: Demo Bridge 2.6 Avalonia Host Migration

on:
  push:
    branches:
      - demo
    paths:
      - .github/workflows/demo-26-avalonia-host-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: demo
          fetch-depth: 0

      - name: Migrate Avalonia host object types
        shell: python
        run: |
          from pathlib import Path
          import re

          paths = [Path("src/OcctNet.Avalonia/OcctAvaloniaViewport.cs"), Path("tests/check-avalonia-host.ps1")]
          changed = []
          for path in paths:
              text = path.read_text(encoding="utf-8-sig")
              updated = re.sub(r"\bOcctObject\b", "IOcctObject", text)
              if updated != text:
                  path.write_text("\ufeff" + updated, encoding="utf-8")
                  changed.append(str(path))
          print("Migrated:", *changed, sep="\n  ")

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/OcctNet.Avalonia tests/check-avalonia-host.ps1
          if git diff --cached --quiet; then
            echo "Avalonia host already uses IOcctObject."
            exit 0
          fi
          git commit -m "Migrate Avalonia host to typed object API"
          git push origin HEAD:demo
