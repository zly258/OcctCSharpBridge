name: Author Normalization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize-author:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize author display
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          root = Path('.')
          extensions = {
              '.md', '.cs', '.csproj', '.props', '.targets', '.ps1', '.yml', '.yaml',
              '.json', '.html', '.css', '.js', '.txt', '.xml', '.sln', '.cmake', '.h',
              '.hpp', '.hxx', '.c', '.cpp', '.cc', '.sh', '.bat', '.cmd'
          }
          names = {'CMakeLists.txt', 'LICENSE'}
          old_western = 'Zhang' + ' Liaoyuan'
          old_chinese = ''.join(chr(value) for value in (0x5F20, 0x71CE, 0x539F))
          canonical = 'Liaoyuan Zhang'
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in extensions and path.name not in names:
                  continue
              raw = path.read_bytes()
              has_bom = raw.startswith(b'\xef\xbb\xbf')
              try:
                  text = raw.decode('utf-8-sig')
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old_western, canonical).replace(old_chinese, canonical)
              updated = re.sub(r'Liaoyuan Zhang\s*[/／|·]\s*Liaoyuan Zhang', canonical, updated)
              updated = re.sub(r'Liaoyuan Zhang\s*\(\s*Liaoyuan Zhang\s*\)', canonical, updated)
              if updated != text:
                  path.write_bytes((b'\xef\xbb\xbf' if has_bom else b'') + updated.encode('utf-8'))
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print('  ' + item)
          '@ | Set-Content -Encoding UTF8 .author-normalize.py
          python .author-normalize.py
          Remove-Item .author-normalize.py

      - name: Commit normalization
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host "No author normalization changes required."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize author name to Liaoyuan Zhang"
          git push

      - name: Audit author references
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path('.')
          old_western = 'Zhang' + ' Liaoyuan'
          old_chinese = ''.join(chr(value) for value in (0x5F20, 0x71CE, 0x539F))
          canonical = 'Liaoyuan Zhang'
          bad = []
          canonical_hits = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_bytes().decode('utf-8-sig')
              except (UnicodeDecodeError, OSError):
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  if old_western in line or old_chinese in line:
                      bad.append((str(path), number, line.strip()))
                  if canonical in line:
                      canonical_hits.append((str(path), number, line.strip()))

          print('Canonical author references:')
          for path, number, line in canonical_hits:
              print(f'  {path}:{number}: {line}')

          if bad:
              print('Non-canonical author references remain:')
              for path, number, line in bad:
                  print(f'  {path}:{number}: {line}')
              raise SystemExit(1)
          print('Author audit passed.')
          '@ | Set-Content -Encoding UTF8 .author-audit.py
          python .author-audit.py
          Remove-Item .author-audit.py
