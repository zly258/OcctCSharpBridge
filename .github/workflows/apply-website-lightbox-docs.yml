name: Apply Website Update

on:
  push:
    branches:
      - update/website-lightbox-docs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/website-lightbox-docs
          fetch-depth: 0
      - name: Apply patch
        run: python3 apply_website_patch.py
      - name: Remove temporary files
        run: rm apply_website_patch.py .github/workflows/apply-website-lightbox-docs.yml
      - name: Commit result
        run: |
          git config user.name zly258
          git config user.email zhangly1403@qq.com
          git add -A
          git commit -m "Add screenshot lightbox and complete getting started flow"
          git push origin HEAD:update/website-lightbox-docs
