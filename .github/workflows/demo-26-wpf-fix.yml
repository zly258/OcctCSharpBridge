name: Demo Bridge 2.6 WPF Fix

on:
  push:
    branches:
      - demo
    paths:
      - .github/workflows/demo-26-wpf-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: demo
          fetch-depth: 0

      - name: Finalize WPF object handling
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/CadWpf/MainWindow.xaml.cs")
          text = path.read_text(encoding="utf-8-sig")
          replacements = [
              ("Session.Engine.Fit(new OcctShape(value.Id))", "Session.Engine.Fit(Session.Engine.GetShape(value.Id))"),
              ("Session.DescribeObject(value.Value)", "Session.DescribeObject(value)"),
              ("_objectNodes.TryGetValue(value.Value.Id, out var item)", "_objectNodes.TryGetValue(value.Id, out var item)"),
              ("return new OcctShape(active.Id);", "return Session.Engine.GetShape(active.Id);"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected WPF token not found: {old}")
              text = text.replace(old, new)
          path.write_text("\ufeff" + text, encoding="utf-8")

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CadWpf/MainWindow.xaml.cs
          git commit -m "Finalize WPF Bridge 2.6 object migration"
          git push origin HEAD:demo
