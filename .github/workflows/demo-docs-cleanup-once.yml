name: Demo Docs Cleanup Once

on:
  push:
    branches:
      - demo-occtdemo-naming
    paths:
      - .github/workflows/demo-docs-cleanup-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: demo-occtdemo-naming
          fetch-depth: 0

      - name: Correct demo architecture documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $utf8Bom = [System.Text.UTF8Encoding]::new($true)

          function Replace-Required([string]$path, [string]$old, [string]$new) {
            $full = Resolve-Path $path
            $text = [System.IO.File]::ReadAllText($full)
            if (-not $text.Contains($old)) { throw "Expected documentation text not found in ${path}: $old" }
            $text = $text.Replace($old, $new)
            [System.IO.File]::WriteAllText($full, $text, $utf8Bom)
          }

          Replace-Required 'README.md' '`global.json` is intentionally branch-specific: `main` uses .NET SDK 8.0.423, while `demo` uses 10.0.302 for Avalonia 12 analyzers. Both still target .NET 8 and C# 12.' '`global.json` uses .NET SDK **10.0.302** on both `main` and `demo`; the published target remains **`net8.0-windows` / C# 12**. The newer build SDK is tooling only and does not raise the consumer target framework.'
          Replace-Required 'README.md' '- `OcctDemo.Common`: shared application/session/command/document layer.' '- `OcctDemo.Common`: demo-only orchestration shared by the three sample applications: command metadata, parameter parsing, localization, replay history, analysis helpers, and the small `DemoSession` facade. It is not a reusable CAD framework.'
          Replace-Required 'README.md' 'There is no generic `OcctObject` wrapper and no public raw-ID constructor. OcctDemo.Common persists IDs but always resolves them through the owning `OcctEngine` before use.' 'Primary demo code uses the owner-aware `IOcctObject` surface. The Bridge 2.5 `OcctObject` type remains only as a compatibility surface; the demos do not build new logic on it. Demo history may store IDs, but resolves them through the owning `OcctEngine` before use.'
          Replace-Required 'README.md' 'The refactor moved existing method bodies by responsibility; command IDs, selection behavior, document/session logic, modeling operations, shortcuts, file exchange, undo/redo, and viewer behavior were not removed.' 'The refactor moved existing method bodies by responsibility; command IDs, selection behavior, session/history logic, modeling operations, shortcuts, file exchange, undo/redo, and viewer behavior were not removed.'

          Replace-Required 'README.zh-CN.md' '`global.json` 按分支设置：`main` 使用 8.0.423，`demo` 使用 10.0.302 以满足 Avalonia 12 Analyzer；两边仍统一目标为 .NET 8 / C# 12。' '`global.json` 在 `main` 与 `demo` 均统一使用 .NET SDK **10.0.302**；对外目标仍为 **`net8.0-windows` / C# 12**。较新的 SDK 只用于构建工具链，不提高使用方的目标框架要求。'
          Replace-Required 'README.zh-CN.md' '**NuGet SDK 打包只属于 `main` 分支。** `demo` 中三个可复用项目明确设置 `IsPackable=false`；本分支负责的是可运行桌面应用以及 app-local Native 依赖闭包发布，不承担 NuGet SDK 发布。' '**NuGet SDK 打包只属于 `main` 分支。** `demo` 中四个共享 Bridge/Host 项目以及四个 `OcctDemo.*` 项目均不承担 NuGet SDK 发布；本分支只负责可运行桌面示例及 app-local Native 依赖闭包发布。'
          Replace-Required 'README.zh-CN.md' '- `OcctDemo.Common`：三个 Demo 共用的 Document/Session/Command 应用层。' '- `OcctDemo.Common`：三个示例共用的 demo-only 编排层，包含命令元数据、参数解析、本地化、回放式历史、分析辅助和轻量 `DemoSession` 门面；它不是可复用 CAD 框架。'
          Replace-Required 'README.zh-CN.md' '这次调整以“方法体按职责移动”为主，没有删除 Command ID、选择行为、Document/Session 逻辑、建模能力、快捷键、文件交换、Undo/Redo 或 Viewer 功能。' '这次调整以“方法体按职责移动”为主，没有删除 Command ID、选择行为、Session/History 逻辑、建模能力、快捷键、文件交换、Undo/Redo 或 Viewer 功能。'

          git add README.md README.zh-CN.md
          git commit -m 'Clarify OcctDemo architecture boundaries in documentation'
          git push origin HEAD:demo-occtdemo-naming

      - name: Remove one-time workflow
        shell: pwsh
        run: |
          git pull --ff-only
          git rm .github/workflows/demo-docs-cleanup-once.yml
          git commit -m 'Remove one-time demo documentation cleanup workflow'
          git push origin HEAD:demo-occtdemo-naming
