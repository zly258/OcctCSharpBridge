name: Website Bridge 2.6 Migration

on:
  push:
    branches:
      - website
    paths:
      - .github/workflows/website-26-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: website
          fetch-depth: 0

      - name: Migrate static website
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8-sig")
          stats = {
              "statNative": "336",
              "statPInvoke": "336",
              "statTypes": "81",
              "statVersion": "2.6.0",
          }
          for key, value in stats.items():
              pattern = re.compile(rf'(<article><strong>)[^<]+(</strong><span data-i18n="{key}">)')
              index, count = pattern.subn(rf'\g<1>{value}\g<2>', index, count=1)
              if count != 1:
                  raise SystemExit(f"Unable to update website statistic: {key}")

          index = index.replace("Bridge 2.5.0", "Bridge 2.6.0")
          index = index.replace("bridge 2.5.0", "bridge 2.6.0")
          index = index.replace("2.5.0 / OCCT 7.9.0", "2.6.0 / ABI 3 / OCCT 7.9.0")
          index_path.write_text("\ufeff" + index, encoding="utf-8")

          for path in [Path("app.js"), Path("README.md"), Path("README.zh-CN.md")]:
              text = path.read_text(encoding="utf-8-sig")
              text = text.replace("2.5.0", "2.6.0")
              text = text.replace("339", "336")
              text = re.sub(r'\b80\s+public', '81 public', text)
              text = text.replace("80 个公开", "81 个公开")
              text = text.replace("80 public", "81 public")
              text = text.replace("ABI 2", "ABI 3")
              text = text.replace("ABI=2", "ABI=3")
              path.write_text("\ufeff" + text, encoding="utf-8")

          app_path = Path("app.js")
          app = app_path.read_text(encoding="utf-8-sig")
          if "2.6.0" not in (index + app):
              raise SystemExit("Bridge 2.6.0 is not represented on the website")
          print("Static website migrated to Bridge 2.6.0 / ABI 3 / 336 / 81.")

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js README.md README.zh-CN.md
          if git diff --cached --quiet; then
            echo "Website is already on Bridge 2.6."
            exit 0
          fi
          git commit -m "Update website for Bridge 2.6"
          git push origin HEAD:website
