name: Demo Build

on:
  push:
    branches:
      - demo
      - agent/**
      - optimize/**
      - sync/**
  pull_request:
    branches:
      - demo

permissions:
  contents: read

concurrency:
  group: demo-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-demo:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run demo CI build
        shell: pwsh
        run: .\build.ps1 ci Release
