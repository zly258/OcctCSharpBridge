name: Patch Avalonia Runtime Host

on:
  push:
    branches: [fix/avalonia-runtime-host]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Avalonia host and runtime deployment fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              p=Path(path); raw=p.read_bytes(); bom=raw.startswith(b'\xef\xbb\xbf'); return p,raw.decode('utf-8-sig'),bom
          def save(p,text,bom):
              p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+text.encode('utf-8'))

          # build.ps1: deploy OcctNative + OCCT + third-party runtime beside CAD-Avalonia.exe.
          p,t,b=load('build.ps1')
          old='$script:OcctBinDir = Join-Path $script:ResolvedOcctRoot "win64\\vc14\\bin"'
          new=old+'\n    $script:OcctThirdPartyDir = Join-Path $script:ResolvedOcctRoot "3rdparty-vc14-64"'
          if new not in t:
              if old not in t: raise SystemExit('build.ps1 OCCT bin marker not found')
              t=t.replace(old,new,1)

          marker='function Build-Project {'
          runtime=r'''function Copy-OcctRuntimeDependencies {
    param([Parameter(Mandatory = $true)][string]$OutputDirectory)

    Resolve-OcctConfiguration
    Assert-Path $OutputDirectory
    Assert-Path $NativeDll

    Write-Host "[runtime] Deploying OCCT runtime beside the application..." -ForegroundColor Cyan
    Copy-Item $NativeDll (Join-Path $OutputDirectory "OcctNative.dll") -Force

    Get-ChildItem $script:OcctBinDir -Filter "*.dll" -File | ForEach-Object {
        Copy-Item $_.FullName (Join-Path $OutputDirectory $_.Name) -Force
    }

    if (Test-Path $script:OcctThirdPartyDir -PathType Container) {
        Get-ChildItem $script:OcctThirdPartyDir -Filter "*.dll" -File -Recurse | Where-Object {
            $_.DirectoryName -match '[\\/]bin([\\/]|$)'
        } | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $OutputDirectory $_.Name) -Force
        }
    }

    Assert-Path (Join-Path $OutputDirectory "OcctNative.dll")
    Assert-Path (Join-Path $OutputDirectory "TKernel.dll")
}

'''
          if 'function Copy-OcctRuntimeDependencies {' not in t:
              if marker not in t: raise SystemExit('Build-Project marker not found')
              t=t.replace(marker,runtime+marker,1)

          old='''        Assert-Path (Join-Path $output $definition.Executable)
        if (Test-Path $NativeDll) {
            Assert-Path (Join-Path $output "OcctNative.dll")
        }'''
          new='''        Assert-Path (Join-Path $output $definition.Executable)
        if (Test-Path $NativeDll) {
            Copy-Item $NativeDll (Join-Path $output "OcctNative.dll") -Force
            Assert-Path (Join-Path $output "OcctNative.dll")
        }'''
          if old in t: t=t.replace(old,new,1)

          old='''    "avalonia" {
        Build-Native
        Build-Project "AvaloniaDemo"
    }'''
          new='''    "avalonia" {
        Build-Native
        Build-Project "AvaloniaDemo"
        $avaloniaProject = Join-Path $RepoRoot $Projects.AvaloniaDemo.Project
        $avaloniaOutput = Join-Path (Split-Path -Parent $avaloniaProject) "bin\\x64\\$Configuration\\net8.0-windows"
        Copy-OcctRuntimeDependencies $avaloniaOutput
    }'''
          if old not in t: raise SystemExit('avalonia switch marker not found')
          t=t.replace(old,new,1)

          old='''        Build-Project "AvaloniaDemo"
        Build-Project "Smoke"'''
          new='''        Build-Project "AvaloniaDemo"
        $avaloniaProject = Join-Path $RepoRoot $Projects.AvaloniaDemo.Project
        $avaloniaOutput = Join-Path (Split-Path -Parent $avaloniaProject) "bin\\x64\\$Configuration\\net8.0-windows"
        Copy-OcctRuntimeDependencies $avaloniaOutput
        Build-Project "Smoke"'''
          if old not in t: raise SystemExit('all switch marker not found')
          t=t.replace(old,new,1)
          save(p,t,b)

          # Host: follow the proven OCCT-Avalonia lifecycle for resize/redraw.
          p,t,b=load('src/OcctNet.Avalonia/OcctAvaloniaViewport.cs')
          if 'using Avalonia.Threading;' not in t:
              t=t.replace('using Avalonia.Platform;\n','using Avalonia.Platform;\nusing Avalonia.Threading;\n',1)
          old='''        _windowProcedure = WindowProcedure;
        Focusable = true;'''
          new='''        _windowProcedure = WindowProcedure;
        Focusable = true;
        SizeChanged += OnHostSizeChanged;'''
          if old not in t: raise SystemExit('viewport constructor marker not found')
          t=t.replace(old,new,1)

          old='''            _engine.Resize();
            _lastHoverTimestamp = 0;
            _lastWorldPointTimestamp = 0;
            EngineInitialized?.Invoke(this, EventArgs.Empty);
            return new PlatformHandle(handle, "HWND");'''
          new='''            _engine.Resize();
            _engine.Redraw();
            _lastHoverTimestamp = 0;
            _lastWorldPointTimestamp = 0;
            EngineInitialized?.Invoke(this, EventArgs.Empty);
            Dispatcher.UIThread.Post(RefreshNativeView, DispatcherPriority.Background);
            return new PlatformHandle(handle, "HWND");'''
          if old not in t: raise SystemExit('viewport initialization marker not found')
          t=t.replace(old,new,1)

          old='''                case WmSize:
                    if (_engine?.IsInitialized == true)
                    {
                        SynchronizeDpi();
                        TryInvoke(_engine.Resize);
                    }
                    break;

'''
          if old in t: t=t.replace(old,'',1)

          marker='''    private void SynchronizeDpi()
    {'''
          handler='''    private void OnHostSizeChanged(object? sender, SizeChangedEventArgs e)
    {
        if (_engine?.IsInitialized != true || _nativeHandle == IntPtr.Zero)
            return;

        SynchronizeDpi();
        TryInvoke(_engine.Resize);
        TryInvoke(_engine.Redraw);
    }

'''
          if 'private void OnHostSizeChanged(' not in t:
              if marker not in t: raise SystemExit('SynchronizeDpi marker not found')
              t=t.replace(marker,handler+marker,1)
          save(p,t,b)

          # Demo: defer scene creation until the native host has returned to Avalonia's dispatcher.
          p,t,b=load('src/CadAvalonia/MainWindow.cs')
          if 'using Avalonia.Threading;' not in t:
              t=t.replace('using Avalonia.Media;\n','using Avalonia.Media;\nusing Avalonia.Threading;\n',1)
          old='_viewport.EngineInitialized += (_, _) => InitializeScene();'
          new='''_viewport.EngineInitialized += (_, _) =>
            Dispatcher.UIThread.Post(InitializeScene, DispatcherPriority.Background);'''
          if old not in t: raise SystemExit('MainWindow EngineInitialized marker not found')
          t=t.replace(old,new,1)
          old='''        Content = root;
    }'''
          new='''        Content = root;
        Opened += (_, _) => Dispatcher.UIThread.Post(_viewport.RefreshNativeView, DispatcherPriority.Background);
    }'''
          if old not in t: raise SystemExit('MainWindow Content marker not found')
          t=t.replace(old,new,1)
          save(p,t,b)

          # Contract test: make deployment and diagnostics part of the Avalonia contract.
          p,t,b=load('tests/check-avalonia-host.ps1')
          t=t.replace('$demoWindow = Join-Path $RepositoryRoot "src\\CadAvalonia\\MainWindow.cs"', '$demoWindow = Join-Path $RepositoryRoot "src\\CadAvalonia\\MainWindow.cs"\n$demoProgram = Join-Path $RepositoryRoot "src\\CadAvalonia\\Program.cs"\n$buildScript = Join-Path $RepositoryRoot "build.ps1"')
          t=t.replace('foreach ($path in @($hostProject, $hostControl, $demoProject, $demoWindow)) {', 'foreach ($path in @($hostProject, $hostControl, $demoProject, $demoWindow, $demoProgram, $buildScript)) {',1)
          t=t.replace("    'EngineInitialized'\n", "    'EngineInitialized',\n    'SizeChanged += OnHostSizeChanged',\n    'Dispatcher.UIThread.Post(RefreshNativeView'\n")
          insert='''
$demoProjectText = [System.IO.File]::ReadAllText($demoProject)
if (-not $demoProjectText.Contains('Avalonia.Fonts.Inter')) {
    throw "Avalonia demo must include Avalonia.Fonts.Inter for deterministic desktop bootstrap."
}

$programText = [System.IO.File]::ReadAllText($demoProgram)
foreach ($token in @('CAD-Avalonia.log', 'EnsureNativeBridgeIsDiscoverable', 'WithInterFont()', 'LogToTrace()', 'MessageBoxW')) {
    if (-not $programText.Contains($token)) {
        throw "Avalonia startup diagnostics contract is missing: $token"
    }
}

$buildText = [System.IO.File]::ReadAllText($buildScript)
foreach ($token in @('Copy-OcctRuntimeDependencies', 'TKernel.dll', 'OcctThirdPartyDir')) {
    if (-not $buildText.Contains($token)) {
        throw "Avalonia runtime deployment contract is missing: $token"
    }
}
'''
          marker='''$demoText = [System.IO.File]::ReadAllText($demoWindow)'''
          if insert.strip() not in t:
              t=t.replace(marker,insert+'\n'+marker,1)
          t=t.replace('foreach ($path in @($hostProject, $hostControl, $demoProject, $demoWindow)) {', 'foreach ($path in @($hostProject, $hostControl, $demoProject, $demoWindow, $demoProgram)) {',1)
          save(p,t,b)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.ps1 src/OcctNet.Avalonia/OcctAvaloniaViewport.cs src/CadAvalonia/MainWindow.cs tests/check-avalonia-host.ps1
          git commit -m "Fix Avalonia native host lifecycle and runtime deployment"
          git push
