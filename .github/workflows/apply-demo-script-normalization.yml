name: Apply Demo Script Normalization

on:
  push:
    branches:
      - sync/demo-api-2.5

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize publish script
        shell: pwsh
        run: python .\.github\normalize_demo_scripts.py

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path '.\publish.ps1'),
              [ref]$tokens,
              [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | Format-List
              throw 'publish.ps1 syntax validation failed.'
          }

      - name: Commit normalized script
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows
          git add publish.ps1 .github/normalize_demo_scripts.py
          if (git diff --cached --quiet) { throw 'No publish script changes were produced.' }
          git commit -m "Normalize demo publish script configuration"
          git push origin HEAD:sync/demo-api-2.5
