name: Apply Viewport API 2.1

on:
  push:
    branches:
      - feature/viewport-api-2.1

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare viewport API migration
        shell: pwsh
        run: python .\.github\fix_viewport_migration.py

      - name: Apply viewport API migration
        shell: pwsh
        run: python .\.github\apply_viewport_api_21.py

      - name: Validate API and project contracts
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Build managed wrapper
        shell: pwsh
        run: dotnet build .\src\OcctNet\OcctNet.csproj -c Release -p:Platform=x64 --nologo

      - name: Build optional WinForms host
        shell: pwsh
        run: dotnet build .\src\OcctNet.WinForms\OcctNet.WinForms.csproj -c Release -p:Platform=x64 --nologo

      - name: Compile smoke test
        shell: pwsh
        run: dotnet build .\tests\OcctNet.Smoke\OcctNet.Smoke.csproj -c Release -p:Platform=x64 --nologo

      - name: Check patch quality
        shell: pwsh
        run: git diff --check

      - name: Commit viewport API 2.1
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw 'No viewport API changes were produced.' }
          git commit -m "Expand standardized viewport API surface"
          git push origin HEAD:feature/viewport-api-2.1
