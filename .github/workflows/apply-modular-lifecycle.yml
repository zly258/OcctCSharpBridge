name: Apply Modular Wrapper Lifecycle

on:
  push:
    branches:
      - optimize/modular-wrapper-lifecycle
    paths:
      - .github/workflows/apply-modular-lifecycle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: optimize/modular-wrapper-lifecycle
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply modularization and lifecycle changes
        shell: pwsh
        run: python .github/apply_modular_lifecycle.py

      - name: Validate API surface
        shell: pwsh
        run: .\build.ps1 validate Release

      - name: Build core wrapper
        shell: pwsh
        run: dotnet build .\src\OcctNet\OcctNet.csproj -c Release -p:Platform=x64 --nologo

      - name: Build optional WinForms host
        shell: pwsh
        run: dotnet build .\src\OcctNet.WinForms\OcctNet.WinForms.csproj -c Release -p:Platform=x64 --nologo

      - name: Compile smoke tests
        shell: pwsh
        run: dotnet build .\tests\OcctNet.Smoke\OcctNet.Smoke.csproj -c Release -p:Platform=x64 --nologo

      - name: Check patch quality
        shell: pwsh
        run: git diff --check

      - name: Commit and push target files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md OcctBridge.sln build.ps1 docs/API_COVERAGE.md docs/API_COVERAGE.zh-CN.md
          git add src/OcctNet src/OcctNet.WinForms
          git commit -m "Split WinForms host and harden native session lifecycle"
          git push origin HEAD:optimize/modular-wrapper-lifecycle
