name: Cleanup merged feature branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in \
            'heads/feature/object-integration-p0' \
            'heads/feature/demo-usability-localization'; do
            encoded_ref="${ref//\//%2F}"
            status=$(curl -sS -o /tmp/delete-ref-response.txt -w '%{http_code}' \
              -X DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/${encoded_ref}")
            if [[ "$status" != '204' && "$status" != '422' ]]; then
              cat /tmp/delete-ref-response.txt
              echo "Unexpected HTTP status while deleting ${ref}: ${status}" >&2
              exit 1
            fi
          done
