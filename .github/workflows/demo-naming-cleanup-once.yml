name: Demo Naming Cleanup Once

on:
  push:
    branches:
      - refactor/demo-naming-cleanup
    paths:
      - .github/workflows/demo-naming-cleanup-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/demo-naming-cleanup
          fetch-depth: 0

      - name: Validate renamed demo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1 validate Release
          .\build.ps1 managed Release

          $legacy = git grep -n -E '\bCad(Common|WinForms|Wpf|Avalonia|CommandId|ParameterKind|ParameterDefinition|CommandDefinition|CommandResult|CommandCatalog|HistoryEntry|Language|Localization|Values|IsoView|DepthBiasPreset|Session)\b' -- src OcctBridge.sln build.ps1 run.ps1 publish.ps1 README.md README.zh-CN.md .github/workflows/demo-build.yml 2>$null
          if ($LASTEXITCODE -eq 0 -and $legacy) {
            Write-Host $legacy
            throw 'Legacy Cad-prefixed demo source naming remains.'
          }
          if ($LASTEXITCODE -notin @(0,1)) { throw 'git grep failed.' }

          foreach ($project in @(
            'src/OcctDemo.Common/OcctDemo.Common.csproj',
            'src/OcctDemo.WinForms/OcctDemo.WinForms.csproj',
            'src/OcctDemo.Wpf/OcctDemo.Wpf.csproj',
            'src/OcctDemo.Avalonia/OcctDemo.Avalonia.csproj'
          )) {
            if (-not (Test-Path $project -PathType Leaf)) { throw "Missing renamed project: $project" }
            $text = Get-Content $project -Raw -Encoding UTF8
            if ($text -notmatch '<IsPackable>false</IsPackable>') { throw "Demo project must be explicitly non-packable: $project" }
          }

      - name: Remove one-time workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only
          git rm .github/workflows/demo-naming-cleanup-once.yml
          git commit -m 'Remove one-time demo naming cleanup workflow'
          git push origin HEAD:refactor/demo-naming-cleanup
